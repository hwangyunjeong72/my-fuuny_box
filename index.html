<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>짤·카드 스튜디오</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }


        /* =========================
           상단
        ========================= */

        header {
            background-color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            color: #777;
        }


        /* =========================
           전체 영역
        ========================= */

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;

            display: flex;
            gap: 30px;
        }


        /* =========================
           왼쪽 설정 패널
        ========================= */

        .control-panel {
            width: 300px;

            background-color: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .control-panel h2 {
            margin-top: 0;
        }


        /* =========================
           이미지 업로드 버튼
        ========================= */

        .upload-button {
            display: block;

            width: 100%;

            padding: 15px;

            background-color: #333;

            color: white;

            text-align: center;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;
        }

        .upload-button:hover {
            background-color: #555;
        }

        #imageInput {
            display: none;
        }


        /* =========================
           설정
        ========================= */

        .setting {
            margin-top: 25px;
        }

        .setting label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }


        /* =========================
           문구 입력
        ========================= */

        #textInput {
            width: 100%;

            padding: 10px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 16px;
        }


        /* =========================
           슬라이더
        ========================= */

        #fontSize,
        #rotation {
            width: 100%;
        }


        /* =========================
           글자 색상
        ========================= */

        #textColor {
            width: 60px;

            height: 40px;

            border: none;

            cursor: pointer;
        }


        /* =========================
           값 표시
        ========================= */

        .value-display {
            display: inline-block;

            margin-top: 5px;

            font-size: 14px;

            color: #555;
        }


        /* =========================
           오류 메시지
        ========================= */

        #errorMessage {
            margin-top: 15px;

            color: #d00000;

            font-size: 14px;

            display: none;
        }


        /* =========================
           오른쪽 미리보기
        ========================= */

        .preview-area {
            flex: 1;

            background-color: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        .preview-area h2 {
            margin-top: 0;
        }


        /* =========================
           이미지 + 텍스트 영역
        ========================= */

        #canvasArea {
            position: relative;

            display: inline-block;

            max-width: 100%;

            margin-top: 20px;
        }


        /* =========================
           업로드 이미지
        ========================= */

        #imagePreview {
            max-width: 100%;

            max-height: 600px;

            display: none;

            border-radius: 8px;

            vertical-align: top;
        }


        /* =========================
           텍스트 박스
        ========================= */

        #textBox {
            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                rotate(0deg);

            color: white;

            font-size: 40px;

            font-weight: bold;

            text-shadow:
                2px 2px 4px black,
                -2px -2px 4px black;

            cursor: move;

            user-select: none;

            display: none;

            white-space: nowrap;
        }


        #textBox:active {
            cursor: grabbing;
        }


        /* =========================
           저장 버튼 영역
        ========================= */

        .save-area {
            display: flex;

            justify-content: center;

            gap: 10px;

            margin-top: 20px;
        }


        /* =========================
           저장 버튼
        ========================= */

        .save-button {
            border: none;

            padding: 13px 25px;

            border-radius: 8px;

            background-color: #333;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        .save-button:hover {
            background-color: #555;
        }


        /* 이미지가 없을 때는 저장 버튼 숨김 */

        #saveArea {
            display: none;
        }


        /* =========================
           이미지가 없을 때
        ========================= */

        #emptyMessage {
            height: 400px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #999;

            border: 2px dashed #ccc;

            border-radius: 10px;

            margin-top: 20px;
        }


        /* =========================
           모바일
        ========================= */

        @media (max-width: 700px) {

            .container {
                flex-direction: column;
            }

            .control-panel {
                width: 100%;
            }

            .preview-area {
                width: 100%;
            }

            #textBox {
                font-size: 28px;
            }

            .save-area {
                flex-direction: column;
            }

            .save-button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         제목
    ========================= -->

    <header>

        <h1>
            짤·카드 스튜디오
        </h1>

        <p>
            이미지를 업로드하고 나만의 밈·카드를 만들어보세요.
        </p>

    </header>



    <!-- =========================
         전체 영역
    ========================= -->

    <div class="container">


        <!-- =========================
             왼쪽 설정
        ========================= -->

        <div class="control-panel">

            <h2>
                편집 설정
            </h2>


            <!-- 이미지 업로드 -->

            <label
                for="imageInput"
                class="upload-button">

                이미지 선택

            </label>


            <input
                type="file"
                id="imageInput"
                accept="image/png, image/jpeg"
            >


            <!-- 문구 -->

            <div class="setting">

                <label for="textInput">
                    문구
                </label>

                <input
                    type="text"
                    id="textInput"
                    placeholder="문구를 입력하세요"
                    value="오늘도 화이팅!"
                >

            </div>


            <!-- 글자 크기 -->

            <div class="setting">

                <label for="fontSize">
                    글자 크기
                </label>

                <input
                    type="range"
                    id="fontSize"
                    min="10"
                    max="100"
                    value="40"
                >

                <span
                    id="fontSizeValue"
                    class="value-display">

                    40px

                </span>

            </div>


            <!-- 글자 색상 -->

            <div class="setting">

                <label for="textColor">
                    글자 색상
                </label>

                <input
                    type="color"
                    id="textColor"
                    value="#ffffff"
                >

            </div>


            <!-- 텍스트 회전 -->

            <div class="setting">

                <label for="rotation">
                    텍스트 회전
                </label>

                <input
                    type="range"
                    id="rotation"
                    min="-180"
                    max="180"
                    value="0"
                    step="1"
                >

                <span
                    id="rotationValue"
                    class="value-display">

                    0°

                </span>

            </div>


            <!-- 안내 -->

            <div class="setting">

                <p
                    style="
                    font-size: 13px;
                    color: #777;
                    line-height: 1.5;
                    ">

                    문구를 입력하면 이미지 위에 표시됩니다.<br>
                    문구를 마우스로 드래그해서 이동할 수 있습니다.<br>
                    회전 슬라이더로 문구를 회전할 수 있습니다.

                </p>

            </div>


            <!-- 오류 -->

            <div id="errorMessage"></div>

        </div>



        <!-- =========================
             오른쪽 미리보기
        ========================= -->

        <div class="preview-area">

            <h2>
                미리보기
            </h2>


            <!-- 이미지가 없을 때 -->

            <div id="emptyMessage">

                이미지를 선택하면<br>
                여기에 미리보기가 나타납니다.

            </div>


            <!-- 이미지 + 텍스트 -->

            <div id="canvasArea">

                <img
                    id="imagePreview"
                    alt="업로드된 이미지"
                >


                <div id="textBox">

                    오늘도 화이팅!

                </div>

            </div>


            <!-- =========================
                 저장 버튼
            ========================= -->

            <div
                id="saveArea"
                class="save-area">

                <button
                    id="savePng"
                    class="save-button">

                    PNG로 저장

                </button>


                <button
                    id="saveJpeg"
                    class="save-button">

                    JPEG로 저장

                </button>

            </div>

        </div>

    </div>



    <!-- =========================
         JavaScript
    ========================= -->

    <script>


        /* =========================
           HTML 요소
        ========================= */

        const imageInput =
            document.getElementById("imageInput");

        const imagePreview =
            document.getElementById("imagePreview");

        const emptyMessage =
            document.getElementById("emptyMessage");

        const errorMessage =
            document.getElementById("errorMessage");

        const textInput =
            document.getElementById("textInput");

        const textBox =
            document.getElementById("textBox");

        const fontSize =
            document.getElementById("fontSize");

        const fontSizeValue =
            document.getElementById("fontSizeValue");

        const textColor =
            document.getElementById("textColor");

        const rotation =
            document.getElementById("rotation");

        const rotationValue =
            document.getElementById("rotationValue");

        const saveArea =
            document.getElementById("saveArea");

        const savePng =
            document.getElementById("savePng");

        const saveJpeg =
            document.getElementById("saveJpeg");



        /* =========================
           이미지 업로드
        ========================= */

        imageInput.addEventListener(
            "change",
            function () {


                errorMessage.style.display =
                    "none";

                errorMessage.textContent =
                    "";


                const file =
                    imageInput.files[0];


                if (!file) {
                    return;
                }


                /* PNG / JPG 확인 */

                if (
                    file.type !== "image/png" &&
                    file.type !== "image/jpeg"
                ) {

                    errorMessage.textContent =
                        "잘못된 파일입니다. PNG 또는 JPG/JPEG 이미지를 선택해주세요.";

                    errorMessage.style.display =
                        "block";


                    imagePreview.style.display =
                        "none";

                    textBox.style.display =
                        "none";

                    saveArea.style.display =
                        "none";

                    emptyMessage.style.display =
                        "flex";


                    imageInput.value =
                        "";

                    return;
                }


                /* 10MB 제한 */

                const maxSize =
                    10 * 1024 * 1024;


                if (file.size > maxSize) {

                    errorMessage.textContent =
                        "파일 크기가 너무 큽니다. 10MB 이하의 이미지를 선택해주세요.";

                    errorMessage.style.display =
                        "block";


                    imagePreview.style.display =
                        "none";

                    textBox.style.display =
                        "none";

                    saveArea.style.display =
                        "none";

                    emptyMessage.style.display =
                        "flex";


                    imageInput.value =
                        "";

                    return;
                }


                /* 이미지 표시 */

                const imageURL =
                    URL.createObjectURL(file);


                imagePreview.src =
                    imageURL;


                imagePreview.style.display =
                    "block";


                emptyMessage.style.display =
                    "none";


                textBox.style.display =
                    "block";


                /* 저장 버튼 표시 */

                saveArea.style.display =
                    "flex";

            }
        );



        /* =========================
           문구 변경
        ========================= */

        textInput.addEventListener(
            "input",
            function () {

                textBox.textContent =
                    textInput.value;

            }
        );



        /* =========================
           글자 크기 변경
        ========================= */

        fontSize.addEventListener(
            "input",
            function () {

                const size =
                    fontSize.value;


                textBox.style.fontSize =
                    size + "px";


                fontSizeValue.textContent =
                    size + "px";

            }
        );



        /* =========================
           글자 색상 변경
        ========================= */

        textColor.addEventListener(
            "input",
            function () {

                textBox.style.color =
                    textColor.value;

            }
        );



        /* =========================
           텍스트 회전
        ========================= */

        rotation.addEventListener(
            "input",
            function () {

                const angle =
                    rotation.value;


                textBox.style.transform =
                    "translate(-50%, -50%) rotate(" +
                    angle +
                    "deg)";


                rotationValue.textContent =
                    angle + "°";

            }
        );



        /* =========================
           텍스트 드래그
        ========================= */

        let isDragging =
            false;

        let startX =
            0;

        let startY =
            0;

        let startLeft =
            0;

        let startTop =
            0;


        /* 마우스를 눌렀을 때 */

        textBox.addEventListener(
            "mousedown",
            function (event) {

                isDragging =
                    true;


                startX =
                    event.clientX;

                startY =
                    event.clientY;


                startLeft =
                    textBox.offsetLeft;

                startTop =
                    textBox.offsetTop;


                event.preventDefault();

            }
        );


        /* 마우스 이동 */

        document.addEventListener(
            "mousemove",
            function (event) {

                if (!isDragging) {
                    return;
                }


                const moveX =
                    event.clientX - startX;

                const moveY =
                    event.clientY - startY;


                textBox.style.left =
                    (startLeft + moveX) + "px";


                textBox.style.top =
                    (startTop + moveY) + "px";


                /* 현재 회전값 유지 */

                textBox.style.transform =
                    "translate(-50%, -50%) rotate(" +
                    rotation.value +
                    "deg)";

            }
        );


        /* 마우스 놓기 */

        document.addEventListener(
            "mouseup",
            function () {

                isDragging =
                    false;

            }
        );



        /* =========================
           모바일 터치 이동
        ========================= */

        textBox.addEventListener(
            "touchstart",
            function (event) {

                const touch =
                    event.touches[0];


                isDragging =
                    true;


                startX =
                    touch.clientX;

                startY =
                    touch.clientY;


                startLeft =
                    textBox.offsetLeft;

                startTop =
                    textBox.offsetTop;

            }
        );


        document.addEventListener(
            "touchmove",
            function (event) {

                if (!isDragging) {
                    return;
                }


                const touch =
                    event.touches[0];


                const moveX =
                    touch.clientX - startX;

                const moveY =
                    touch.clientY - startY;


                textBox.style.left =
                    (startLeft + moveX) + "px";


                textBox.style.top =
                    (startTop + moveY) + "px";


                textBox.style.transform =
                    "translate(-50%, -50%) rotate(" +
                    rotation.value +
                    "deg)";


                event.preventDefault();

            },
            {
                passive: false
            }
        );


        document.addEventListener(
            "touchend",
            function () {

                isDragging =
                    false;

            }
        );



        /* ==================================================
           이미지 저장 함수
        ================================================== */

        function saveImage(format) {


            /* 이미지가 없는 경우 */

            if (
                !imagePreview.src ||
                imagePreview.style.display === "none"
            ) {

                alert(
                    "먼저 이미지를 업로드해주세요."
                );

                return;
            }


            /* =========================
               원본 이미지 크기로 Canvas 생성
            ========================= */

            const canvas =
                document.createElement("canvas");


            canvas.width =
                imagePreview.naturalWidth;

            canvas.height =
                imagePreview.naturalHeight;


            const ctx =
                canvas.getContext("2d");


            /* =========================
               원본 이미지 그리기
            ========================= */

            ctx.drawImage(
                imagePreview,
                0,
                0,
                canvas.width,
                canvas.height
            );


            /* =========================
               미리보기 이미지와
               원본 이미지의 비율 계산
            ========================= */

            const previewWidth =
                imagePreview.clientWidth;

            const previewHeight =
                imagePreview.clientHeight;


            const originalWidth =
                imagePreview.naturalWidth;

            const originalHeight =
                imagePreview.naturalHeight;


            const scaleX =
                originalWidth / previewWidth;

            const scaleY =
                originalHeight / previewHeight;


            /* =========================
               텍스트 위치 계산
            ========================= */

            const textLeft =
                textBox.offsetLeft;

            const textTop =
                textBox.offsetTop;


            const textX =
                textLeft * scaleX;

            const textY =
                textTop * scaleY;


            /* =========================
               글자 크기 계산
            ========================= */

            const originalFontSize =
                parseFloat(
                    getComputedStyle(textBox).fontSize
                );


            const canvasFontSize =
                originalFontSize *
                scaleX;


            /* =========================
               Canvas 텍스트 설정
            ========================= */

            ctx.save();


            ctx.translate(
                textX,
                textY
            );


            /* 회전 */

            const angle =
                parseFloat(
                    rotation.value
                );


            ctx.rotate(
                angle * Math.PI / 180
            );


            /* 글자 설정 */

            ctx.font =
                "bold " +
                canvasFontSize +
                "px Arial";


            ctx.fillStyle =
                textColor.value;


            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";


            /* =========================
               글자 그림자
            ========================= */

            ctx.shadowColor =
                "black";

            ctx.shadowBlur =
                4 * scaleX;

            ctx.shadowOffsetX =
                2 * scaleX;

            ctx.shadowOffsetY =
                2 * scaleY;


            /* =========================
               텍스트 그리기
            ========================= */

            ctx.fillText(
                textInput.value,
                0,
                0
            );


            ctx.restore();



            /* =========================
               파일 저장
            ========================= */

            let mimeType;
            let extension;


            if (format === "png") {

                mimeType =
                    "image/png";

                extension =
                    "png";

            } else {

                mimeType =
                    "image/jpeg";

                extension =
                    "jpg";

            }


            /* =========================
               Canvas → 파일
            ========================= */

            canvas.toBlob(
                function (blob) {

                    if (!blob) {

                        alert(
                            "이미지를 저장하지 못했습니다."
                        );

                        return;
                    }


                    /* 다운로드 주소 생성 */

                    const url =
                        URL.createObjectURL(blob);


                    /* 다운로드 링크 */

                    const link =
                        document.createElement("a");


                    link.href =
                        url;


                    link.download =
                        "my-funny-box." +
                        extension;


                    document.body.appendChild(
                        link
                    );


                    link.click();


                    document.body.removeChild(
                        link
                    );


                    /* 사용이 끝난 URL 제거 */

                    setTimeout(
                        function () {

                            URL.revokeObjectURL(
                                url
                            );

                        },
                        100
                    );

                },
                mimeType,

                /* JPEG 품질 */

                format === "jpeg"
                    ? 0.95
                    : undefined
            );

        }



        /* =========================
           PNG 저장 버튼
        ========================= */

        savePng.addEventListener(
            "click",
            function () {

                saveImage("png");

            }
        );



        /* =========================
           JPEG 저장 버튼
        ========================= */

        saveJpeg.addEventListener(
            "click",
            function () {

                saveImage("jpeg");

            }
        );


    </script>

</body>

</html>
