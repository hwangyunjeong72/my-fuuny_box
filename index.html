```html
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>짤·카드 스튜디오</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* 상단 제목 */
        header {
            background-color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            color: #777;
        }

        /* 전체 영역 */
        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
            display: flex;
            gap: 30px;
        }

        /* 왼쪽 설정 영역 */
        .control-panel {
            width: 300px;
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .control-panel h2 {
            margin-top: 0;
        }

        /* 이미지 선택 버튼 */
        .upload-button {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #333;
            color: white;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .upload-button:hover {
            background-color: #555;
        }

        /* 실제 파일 선택 버튼은 숨김 */
        #imageInput {
            display: none;
        }

        /* 안내 문구 */
        .help-text {
            margin-top: 12px;
            font-size: 13px;
            color: #777;
            line-height: 1.5;
        }

        /* 오류 메시지 */
        #errorMessage {
            margin-top: 15px;
            color: #d00000;
            font-size: 14px;
            display: none;
        }

        /* 오른쪽 미리보기 영역 */
        .preview-area {
            flex: 1;
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .preview-area h2 {
            margin-top: 0;
        }

        /* 이미지가 표시되는 공간 */
        #imagePreview {
            max-width: 100%;
            max-height: 600px;
            display: none;
            margin: 20px auto 0;
            border-radius: 8px;
        }

        /* 이미지가 없을 때 */
        #emptyMessage {
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            border: 2px dashed #ccc;
            border-radius: 10px;
            margin-top: 20px;
        }

        /* 모바일 화면 */
        @media (max-width: 700px) {
            .container {
                flex-direction: column;
            }

            .control-panel {
                width: 100%;
            }

            .preview-area {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- 사이트 제목 -->
    <header>
        <h1>짤·카드 스튜디오</h1>
        <p>이미지를 업로드하고 나만의 밈·카드를 만들어보세요.</p>
    </header>


    <!-- 메인 영역 -->
    <div class="container">

        <!-- 왼쪽 설정 -->
        <div class="control-panel">

            <h2>이미지 업로드</h2>

            <!-- 이미지 선택 -->
            <label for="imageInput" class="upload-button">
                이미지 선택
            </label>

            <input
                type="file"
                id="imageInput"
                accept="image/png, image/jpeg"
            >

            <div class="help-text">
                PNG 또는 JPG/JPEG 파일만 업로드할 수 있습니다.
            </div>

            <!-- 오류 메시지 -->
            <div id="errorMessage"></div>

        </div>


        <!-- 오른쪽 미리보기 -->
        <div class="preview-area">

            <h2>미리보기</h2>

            <!-- 이미지가 없을 때 표시 -->
            <div id="emptyMessage">
                이미지를 선택하면<br>
                여기에 미리보기가 나타납니다.
            </div>

            <!-- 업로드된 이미지 -->
            <img id="imagePreview" alt="업로드된 이미지">

        </div>

    </div>


    <script>

        // 이미지 선택 버튼
        const imageInput = document.getElementById("imageInput");

        // 미리보기 이미지
        const imagePreview = document.getElementById("imagePreview");

        // 이미지가 없을 때 표시되는 문구
        const emptyMessage = document.getElementById("emptyMessage");

        // 오류 메시지
        const errorMessage = document.getElementById("errorMessage");


        // 이미지가 선택되었을 때 실행
        imageInput.addEventListener("change", function () {

            // 오류 메시지 초기화
            errorMessage.style.display = "none";
            errorMessage.textContent = "";

            // 선택된 파일 가져오기
            const file = imageInput.files[0];

            // 파일을 선택하지 않은 경우
            if (!file) {
                return;
            }


            // 이미지 파일인지 확인
            if (file.type !== "image/png" &&
                file.type !== "image/jpeg") {

                errorMessage.textContent =
                    "잘못된 파일입니다. PNG 또는 JPG/JPEG 이미지를 선택해주세요.";

                errorMessage.style.display = "block";

                // 기존 미리보기 제거
                imagePreview.style.display = "none";
                emptyMessage.style.display = "flex";

                // 파일 선택 초기화
                imageInput.value = "";

                return;
            }


            // 파일 크기 확인
            // 10MB를 초과하면 거부
            const maxSize = 10 * 1024 * 1024;

            if (file.size > maxSize) {

                errorMessage.textContent =
                    "파일 크기가 너무 큽니다. 10MB 이하의 이미지를 선택해주세요.";

                errorMessage.style.display = "block";

                imagePreview.style.display = "none";
                emptyMessage.style.display = "flex";

                imageInput.value = "";

                return;
            }


            // 정상적인 이미지인 경우
            const imageURL = URL.createObjectURL(file);

            // 미리보기 이미지에 주소 설정
            imagePreview.src = imageURL;

            // 이미지 표시
            imagePreview.style.display = "block";

            // "이미지를 선택하세요" 영역 숨기기
            emptyMessage.style.display = "none";

        });

    </script>

</body>

</html>
