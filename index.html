<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>짤·카드 스튜디오</title>


<style>

/* =====================================
   기본 설정
===================================== */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family: Arial, sans-serif;

    background-color: #f2f2f2;

}


/* =====================================
   상단
===================================== */

header {

    background-color: white;

    padding: 20px;

    text-align: center;

    border-bottom: 1px solid #ddd;

}


header h1 {

    margin: 0;

    font-size: 28px;

}


header p {

    margin: 8px 0 0;

    color: #777;

}


/* =====================================
   전체 영역
===================================== */

.container {

    width: 90%;

    max-width: 1100px;

    margin: 40px auto;

    display: flex;

    gap: 30px;

}


/* =====================================
   왼쪽 설정
===================================== */

.control-panel {

    width: 300px;

    background-color: white;

    padding: 25px;

    border-radius: 12px;

    box-shadow:
        0 3px 10px rgba(0,0,0,0.08);

}


.control-panel h2 {

    margin-top: 0;

}


/* =====================================
   이미지 선택
===================================== */

.upload-button {

    display: block;

    width: 100%;

    padding: 15px;

    background-color: #333;

    color: white;

    text-align: center;

    border-radius: 8px;

    cursor: pointer;

    font-size: 16px;

}


.upload-button:hover {

    background-color: #555;

}


#imageInput {

    display: none;

}


/* =====================================
   설명
===================================== */

.help-text {

    margin-top: 12px;

    font-size: 13px;

    color: #777;

    line-height: 1.5;

}


/* =====================================
   오류
===================================== */

#errorMessage {

    margin-top: 15px;

    color: #d00000;

    font-size: 14px;

    display: none;

}


/* =====================================
   설정
===================================== */

.setting {

    margin-top: 20px;

}


.setting label {

    display: block;

    margin-bottom: 7px;

    font-weight: bold;

}


.setting input[type="text"] {

    width: 100%;

    padding: 9px;

    border: 1px solid #ccc;

    border-radius: 6px;

    font-size: 15px;

}


.setting input[type="number"] {

    width: 100%;

    padding: 9px;

    border: 1px solid #ccc;

    border-radius: 6px;

    font-size: 15px;

}


.setting input[type="color"] {

    width: 100%;

    height: 40px;

}


#rotation {

    width: 100%;

}


/* =====================================
   별 버튼
===================================== */

#starToggle {

    width: 100%;

    padding: 11px;

    border: none;

    border-radius: 7px;

    background-color: #333;

    color: white;

    cursor: pointer;

    font-size: 15px;

}


#starToggle:hover {

    background-color: #555;

}


/* =====================================
   별 선택창
===================================== */

#starPanel {

    display: none;

    margin-top: 10px;

    padding: 10px;

    background-color: #f5f5f5;

    border-radius: 8px;

}


.star-list {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 5px;

}


.star-button {

    width: 48px;

    height: 48px;

    padding: 3px;

    border: 1px solid #ddd;

    background-color: white;

    border-radius: 6px;

    cursor: pointer;

}


.star-button:hover {

    border-color: #333;

}


.star-button img {

    width: 100%;

    height: 100%;

    object-fit: contain;

    pointer-events: none;

}


/* =====================================
   저장 버튼
===================================== */

.save-button {

    width: 100%;

    margin-top: 10px;

    padding: 11px;

    border: none;

    border-radius: 7px;

    background-color: #333;

    color: white;

    cursor: pointer;

}


.save-button:hover {

    background-color: #555;

}


/* =====================================
   미리보기
===================================== */

.preview-area {

    flex: 1;

    background-color: white;

    padding: 25px;

    border-radius: 12px;

    box-shadow:
        0 3px 10px rgba(0,0,0,0.08);

    text-align: center;

}


.preview-area h2 {

    margin-top: 0;

}


/* =====================================
   편집 영역
===================================== */

#editor {

    position: relative;

    display: inline-block;

    max-width: 100%;

    margin-top: 20px;

}


/* =====================================
   이미지
===================================== */

#imagePreview {

    max-width: 100%;

    max-height: 600px;

    display: none;

    margin: 0 auto;

    border-radius: 8px;

}


/* =====================================
   이미지가 없을 때
===================================== */

#emptyMessage {

    height: 400px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #999;

    border: 2px dashed #ccc;

    border-radius: 10px;

    margin-top: 20px;

}


/* =====================================
   텍스트
===================================== */

#textPreview {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%)
        rotate(0deg);

    color: white;

    font-size: 40px;

    font-weight: bold;

    white-space: nowrap;

    cursor: move;

    user-select: none;

    z-index: 10;

}


/* =====================================
   추가된 별
===================================== */

.added-star {

    position: absolute;

    width: 70px;

    height: 70px;

    object-fit: contain;

    cursor: move;

    user-select: none;

    touch-action: none;

    z-index: 20;

}


/* =====================================
   모바일
===================================== */

@media (max-width: 700px) {

    .container {

        flex-direction: column;

    }


    .control-panel {

        width: 100%;

    }


    .preview-area {

        width: 100%;

    }

}

</style>

</head>


<body>


<!-- =====================================
     제목
===================================== -->

<header>

    <h1>짤·카드 스튜디오</h1>

    <p>
        이미지를 업로드하고 나만의 밈·카드를 만들어보세요.
    </p>

</header>



<div class="container">


<!-- =====================================
     왼쪽 설정
===================================== -->

<div class="control-panel">

    <h2>설정</h2>


    <!-- 이미지 선택 -->

    <label
        for="imageInput"
        class="upload-button"
    >

        이미지 선택

    </label>


    <input
        type="file"
        id="imageInput"
        accept="image/png, image/jpeg"
    >


    <div class="help-text">

        PNG 또는 JPG/JPEG 파일만
        업로드할 수 있습니다.

    </div>


    <div id="errorMessage"></div>



    <!-- =================================
         텍스트
    ================================== -->

    <div class="setting">

        <label for="textInput">
            텍스트
        </label>


        <input
            type="text"
            id="textInput"
            placeholder="텍스트를 입력하세요"
        >

    </div>



    <!-- =================================
         글자 크기
    ================================== -->

    <div class="setting">

        <label for="fontSize">
            글자 크기
        </label>


        <input
            type="number"
            id="fontSize"
            value="40"
            min="10"
            max="200"
        >

    </div>



    <!-- =================================
         글자 색
    ================================== -->

    <div class="setting">

        <label for="textColor">
            글자 색
        </label>


        <input
            type="color"
            id="textColor"
            value="#ffffff"
        >

    </div>



    <!-- =================================
         글자 회전
    ================================== -->

    <div class="setting">

        <label for="rotation">

            글자 회전

            <span id="rotationValue">
                0°
            </span>

        </label>


        <input
            type="range"
            id="rotation"
            min="-180"
            max="180"
            value="0"
        >

    </div>



    <!-- =================================
         별 아이콘
    ================================== -->

    <div class="setting">

        <button
            type="button"
            id="starToggle"
        >

            ⭐ 별 아이콘

        </button>


        <div id="starPanel">

            <div class="star-list">


                <!-- 노란별 -->

                <button
                    type="button"
                    class="star-button"
                    data-star="노란별.png"
                >

                    <img
                        src="노란별.png"
                        alt="노란별"
                    >

                </button>



                <!-- 파란별 -->

                <button
                    type="button"
                    class="star-button"
                    data-star="파란별.png"
                >

                    <img
                        src="파란별.png"
                        alt="파란별"
                    >

                </button>



                <!-- 보라별 -->

                <button
                    type="button"
                    class="star-button"
                    data-star="보라별.png"
                >

                    <img
                        src="보라별.png"
                        alt="보라별"
                    >

                </button>



                <!-- 초록별 -->

                <button
                    type="button"
                    class="star-button"
                    data-star="초록별.png"
                >

                    <img
                        src="초록별.png"
                        alt="초록별"
                    >

                </button>



                <!-- 핑크별 -->

                <button
                    type="button"
                    class="star-button"
                    data-star="핑크별.png"
                >

                    <img
                        src="핑크별.png"
                        alt="핑크별"
                    >

                </button>


            </div>

        </div>

    </div>



    <!-- =================================
         저장
    ================================== -->

    <div class="setting">

        <button
            type="button"
            class="save-button"
            id="savePNG"
        >

            PNG로 저장

        </button>


        <button
            type="button"
            class="save-button"
            id="saveJPG"
        >

            JPG로 저장

        </button>

    </div>


</div>



<!-- =====================================
     오른쪽 미리보기
===================================== -->

<div class="preview-area">

    <h2>미리보기</h2>


    <div id="emptyMessage">

        이미지를 선택하면
        <br>
        여기에 미리보기가 나타납니다.

    </div>


    <div id="editor">

        <img
            id="imagePreview"
            alt="업로드된 이미지"
        >


        <div id="textPreview"></div>

    </div>

</div>


</div>



<script>


/* ==========================================
   기본 요소
========================================== */

const imageInput =
    document.getElementById("imageInput");


const imagePreview =
    document.getElementById("imagePreview");


const emptyMessage =
    document.getElementById("emptyMessage");


const errorMessage =
    document.getElementById("errorMessage");


const textInput =
    document.getElementById("textInput");


const fontSize =
    document.getElementById("fontSize");


const textColor =
    document.getElementById("textColor");


const rotation =
    document.getElementById("rotation");


const rotationValue =
    document.getElementById("rotationValue");


const textPreview =
    document.getElementById("textPreview");


const editor =
    document.getElementById("editor");


const starToggle =
    document.getElementById("starToggle");


const starPanel =
    document.getElementById("starPanel");


const starButtons =
    document.querySelectorAll(".star-button");



/* ==========================================
   이미지 업로드
========================================== */

imageInput.addEventListener(
    "change",
    function () {

        errorMessage.style.display =
            "none";

        errorMessage.textContent =
            "";


        const file =
            imageInput.files[0];


        if (!file) {

            return;

        }


        /* 파일 종류 확인 */

        if (
            file.type !== "image/png" &&
            file.type !== "image/jpeg"
        ) {

            errorMessage.textContent =
                "PNG 또는 JPG/JPEG 이미지만 사용할 수 있습니다.";

            errorMessage.style.display =
                "block";

            imagePreview.style.display =
                "none";

            emptyMessage.style.display =
                "flex";

            imageInput.value =
                "";

            return;

        }


        /* 파일 크기 확인 */

        const maxSize =
            10 * 1024 * 1024;


        if (file.size > maxSize) {

            errorMessage.textContent =
                "파일 크기는 10MB 이하만 가능합니다.";

            errorMessage.style.display =
                "block";

            imagePreview.style.display =
                "none";

            emptyMessage.style.display =
                "flex";

            imageInput.value =
                "";

            return;

        }


        /* 이미지 표시 */

        const imageURL =
            URL.createObjectURL(file);


        imagePreview.src =
            imageURL;


        imagePreview.onload =
            function () {

                imagePreview.style.display =
                    "block";

                emptyMessage.style.display =
                    "none";

                URL.revokeObjectURL(
                    imageURL
                );

            };

    }
);



/* ==========================================
   텍스트
========================================== */

textInput.addEventListener(
    "input",
    function () {

        textPreview.textContent =
            textInput.value;

    }
);



/* ==========================================
   글자 크기
========================================== */

fontSize.addEventListener(
    "input",
    function () {

        textPreview.style.fontSize =
            fontSize.value + "px";

    }
);



/* ==========================================
   글자 색
========================================== */

textColor.addEventListener(
    "input",
    function () {

        textPreview.style.color =
            textColor.value;

    }
);



/* ==========================================
   글자 회전
========================================== */

rotation.addEventListener(
    "input",
    function () {

        const value =
            rotation.value;


        rotationValue.textContent =
            value + "°";


        textPreview.style.transform =
            "translate(-50%, -50%) rotate(" +
            value +
            "deg)";

    }
);



/* ==========================================
   별 선택창 열기
========================================== */

starToggle.addEventListener(
    "click",
    function () {

        if (
            starPanel.style.display ===
            "block"
        ) {

            starPanel.style.display =
                "none";

        } else {

            starPanel.style.display =
                "block";

        }

    }
);



/* ==================================================
   ★ 검정색 배경 제거 함수 ★

   중요한 부분

   이미지 전체의 검정색을 삭제하지 않는다.

   "이미지 가장자리와 연결되어 있는 검정색"
   만 삭제한다.

   따라서 별 내부의 검정색이나
   검은색 테두리는 최대한 유지된다.
================================================== */

function removeBlackBackground(
    image
) {

    return new Promise(
        function (resolve, reject) {


            /* 임시 Canvas */

            const canvas =
                document.createElement(
                    "canvas"
                );


            const ctx =
                canvas.getContext(
                    "2d",
                    {
                        willReadFrequently: true
                    }
                );


            canvas.width =
                image.naturalWidth;


            canvas.height =
                image.naturalHeight;


            /* 이미지 그리기 */

            ctx.drawImage(
                image,
                0,
                0
            );


            let imageData;


            try {

                imageData =
                    ctx.getImageData(
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );

            } catch (error) {

                reject(error);

                return;

            }


            const data =
                imageData.data;


            const width =
                canvas.width;


            const height =
                canvas.height;



            /* ====================================
               검정색 판단

               완전한 검정색뿐만 아니라
               아주 어두운 검정색도 포함
            ==================================== */

            function isBlack(
                x,
                y
            ) {

                const index =
                    (
                        y * width +
                        x
                    ) * 4;


                const r =
                    data[index];


                const g =
                    data[index + 1];


                const b =
                    data[index + 2];


                const a =
                    data[index + 3];


                if (a === 0) {

                    return false;

                }


                return (
                    r <= 20 &&
                    g <= 20 &&
                    b <= 20
                );

            }



            /* ====================================
               방문 여부
            ==================================== */

            const visited =
                new Uint8Array(
                    width * height
                );


            const queue = [];



            /* ====================================
               검정색 픽셀 추가
            ==================================== */

            function addIfBlack(
                x,
                y
            ) {

                if (
                    x < 0 ||
                    y < 0 ||
                    x >= width ||
                    y >= height
                ) {

                    return;

                }


                const position =
                    y * width +
                    x;


                if (
                    visited[position]
                ) {

                    return;

                }


                if (
                    !isBlack(
                        x,
                        y
                    )
                ) {

                    return;

                }


                visited[position] =
                    1;


                queue.push(
                    [
                        x,
                        y
                    ]
                );

            }



            /* ====================================
               이미지 가장자리 검색
            ==================================== */

            /* 위쪽 */

            for (
                let x = 0;
                x < width;
                x++
            ) {

                addIfBlack(
                    x,
                    0
                );

            }


            /* 아래쪽 */

            for (
                let x = 0;
                x < width;
                x++
            ) {

                addIfBlack(
                    x,
                    height - 1
                );

            }


            /* 왼쪽 */

            for (
                let y = 0;
                y < height;
                y++
            ) {

                addIfBlack(
                    0,
                    y
                );

            }


            /* 오른쪽 */

            for (
                let y = 0;
                y < height;
                y++
            ) {

                addIfBlack(
                    width - 1,
                    y
                );

            }



            /* ====================================
               연결된 검정색 제거
            ==================================== */

            let queueIndex =
                0;


            while (
                queueIndex <
                queue.length
            ) {


                const point =
                    queue[
                        queueIndex++
                    ];


                const x =
                    point[0];


                const y =
                    point[1];


                const pixelIndex =
                    (
                        y * width +
                        x
                    ) * 4;


                /*
                 * 투명하게 만든다.
                 */

                data[
                    pixelIndex + 3
                ] = 0;



                /* 위 */

                addIfBlack(
                    x,
                    y - 1
                );


                /* 아래 */

                addIfBlack(
                    x,
                    y + 1
                );


                /* 왼쪽 */

                addIfBlack(
                    x - 1,
                    y
                );


                /* 오른쪽 */

                addIfBlack(
                    x + 1,
                    y
                );

            }



            /* 변경된 이미지 적용 */

            ctx.putImageData(
                imageData,
                0,
                0
            );



            /* ====================================
               투명 PNG 생성
            ==================================== */

            const result =
                new Image();


            result.onload =
                function () {

                    resolve(
                        result
                    );

                };


            result.onerror =
                function () {

                    reject(
                        new Error(
                            "투명 이미지 생성 실패"
                        )
                    );

                };


            result.src =
                canvas.toDataURL(
                    "image/png"
                );

        }
    );

}



/* ==========================================
   별 추가
========================================== */

starButtons.forEach(
    function (button) {


        button.addEventListener(
            "click",
            function () {


                const fileName =
                    button.dataset.star;



                /* 별 원본 불러오기 */

                const original =
                    new Image();


                original.onload =
                    async function () {

                        try {


                            /*
                             * 주변 검정색 제거
                             */

                            const cleanStar =
                                await removeBlackBackground(
                                    original
                                );



                            /*
                             * 실제 별 생성
                             */

                            const star =
                                document.createElement(
                                    "img"
                                );


                            star.src =
                                cleanStar.src;


                            star.className =
                                "added-star";


                            star.alt =
                                "추가된 별";



                            /*
                             * 미리보기 중앙에 배치
                             */

                            star.style.left =
                                (
                                    editor.clientWidth /
                                    2 -
                                    35
                                ) + "px";


                            star.style.top =
                                (
                                    editor.clientHeight /
                                    2 -
                                    35
                                ) + "px";



                            /*
                             * 화면에 추가
                             */

                            editor.appendChild(
                                star
                            );



                            /*
                             * 드래그 기능
                             */

                            makeStarDraggable(
                                star
                            );


                        } catch (
                            error
                        ) {


                            console.error(
                                error
                            );


                            alert(
                                "별 이미지를 처리하는 중 오류가 발생했습니다."
                            );

                        }

                    };



                /*
                 * 파일이 없을 경우
                 */

                original.onerror =
                    function () {

                        alert(
                            fileName +
                            " 파일을 찾을 수 없습니다.\n\n" +
                            "index.html과 같은 폴더에 파일이 있는지 확인해주세요."
                        );

                    };



                /*
                 * 캐시 방지
                 */

                original.src =
                    fileName +
                    "?v=" +
                    Date.now();

            }

        );

    }
);



/* ==========================================
   별 드래그
========================================== */

function makeStarDraggable(
    star
) {


    let dragging =
        false;


    let offsetX =
        0;


    let offsetY =
        0;



    /* 마우스 시작 */

    star.addEventListener(
        "mousedown",
        function (event) {


            dragging =
                true;


            const rect =
                star.getBoundingClientRect();


            offsetX =
                event.clientX -
                rect.left;


            offsetY =
                event.clientY -
                rect.top;


            event.preventDefault();

        }
    );



    /* 마우스 이동 */

    document.addEventListener(
        "mousemove",
        function (event) {


            if (!dragging) {

                return;

            }


            const editorRect =
                editor.getBoundingClientRect();


            let x =
                event.clientX -
                editorRect.left -
                offsetX;


            let y =
                event.clientY -
                editorRect.top -
                offsetY;



            /* 영역 밖으로 나가지 않게 */

            x =
                Math.max(
                    0,
                    Math.min(
                        x,
                        editor.clientWidth -
                        star.offsetWidth
                    )
                );


            y =
                Math.max(
                    0,
                    Math.min(
                        y,
                        editor.clientHeight -
                        star.offsetHeight
                    )
                );



            star.style.left =
                x + "px";


            star.style.top =
                y + "px";

        }
    );



    /* 마우스 종료 */

    document.addEventListener(
        "mouseup",
        function () {

            dragging =
                false;

        }
    );

}



/* ==========================================
   텍스트 드래그
========================================== */

let textDragging =
    false;


let textOffsetX =
    0;


let textOffsetY =
    0;



textPreview.addEventListener(
    "mousedown",
    function (event) {


        textDragging =
            true;


        const rect =
            textPreview.getBoundingClientRect();


        textOffsetX =
            event.clientX -
            rect.left;


        textOffsetY =
            event.clientY -
            rect.top;


        event.preventDefault();

    }
);



document.addEventListener(
    "mousemove",
    function (event) {


        if (!textDragging) {

            return;

        }


        const editorRect =
            editor.getBoundingClientRect();


        const x =
            event.clientX -
            editorRect.left -
            textOffsetX;


        const y =
            event.clientY -
            editorRect.top -
            textOffsetY;


        textPreview.style.left =
            x + "px";


        textPreview.style.top =
            y + "px";


        textPreview.style.transform =
            "rotate(" +
            rotation.value +
            "deg)";

    }
);



document.addEventListener(
    "mouseup",
    function () {

        textDragging =
            false;

    }
);



/* ==========================================
   저장
========================================== */

function saveImage(
    type
) {


    if (
        !imagePreview.src ||
        !imagePreview.naturalWidth
    ) {

        alert(
            "먼저 이미지를 선택해주세요."
        );

        return;

    }



    const canvas =
        document.createElement(
            "canvas"
        );


    const ctx =
        canvas.getContext(
            "2d"
        );


    canvas.width =
        imagePreview.naturalWidth;


    canvas.height =
        imagePreview.naturalHeight;



    /* 원본 이미지 */

    ctx.drawImage(
        imagePreview,
        0,
        0,
        canvas.width,
        canvas.height
    );



    /* 실제 크기 비율 */

    const scaleX =
        canvas.width /
        imagePreview.clientWidth;


    const scaleY =
        canvas.height /
        imagePreview.clientHeight;



    /* =====================================
       텍스트 저장
    ===================================== */

    if (
        textPreview.textContent.trim()
        !== ""
    ) {


        const textRect =
            textPreview.getBoundingClientRect();


        const imageRect =
            imagePreview.getBoundingClientRect();


        const x =
            (
                textRect.left +
                textRect.width / 2 -
                imageRect.left
            ) * scaleX;


        const y =
            (
                textRect.top +
                textRect.height / 2 -
                imageRect.top
            ) * scaleY;


        const size =
            parseInt(
                fontSize.value
            ) * scaleX;



        ctx.save();


        ctx.translate(
            x,
            y
        );


        ctx.rotate(
            Number(
                rotation.value
            ) *
            Math.PI /
            180
        );


        ctx.font =
            "bold " +
            size +
            "px Arial";


        ctx.fillStyle =
            textColor.value;


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        ctx.fillText(
            textPreview.textContent,
            0,
            0
        );


        ctx.restore();

    }



    /* =====================================
       별 저장
    ===================================== */

    const stars =
        document.querySelectorAll(
            ".added-star"
        );


    stars.forEach(
        function (star) {


            const starRect =
                star.getBoundingClientRect();


            const imageRect =
                imagePreview.getBoundingClientRect();


            const x =
                (
                    starRect.left -
                    imageRect.left
                ) * scaleX;


            const y =
                (
                    starRect.top -
                    imageRect.top
                ) * scaleY;


            const width =
                starRect.width *
                scaleX;


            const height =
                starRect.height *
                scaleY;



            ctx.drawImage(
                star,
                x,
                y,
                width,
                height
            );

        }
    );



    /* =====================================
       파일 형식
    ===================================== */

    let mimeType;

    let extension;


    if (
        type === "png"
    ) {

        mimeType =
            "image/png";

        extension =
            "png";

    } else {

        mimeType =
            "image/jpeg";

        extension =
            "jpg";

    }



    /* =====================================
       저장
    ===================================== */

    canvas.toBlob(
        function (blob) {


            if (!blob) {

                alert(
                    "이미지 저장에 실패했습니다."
                );

                return;

            }


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                "짤카드." +
                extension;


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );


            URL.revokeObjectURL(
                url
            );

        },
        mimeType,
        0.95
    );

}



/* ==========================================
   PNG 저장
========================================== */

document.getElementById(
    "savePNG"
).addEventListener(
    "click",
    function () {

        saveImage(
            "png"
        );

    }
);



/* ==========================================
   JPG 저장
========================================== */

document.getElementById(
    "saveJPG"
).addEventListener(
    "click",
    function () {

        saveImage(
            "jpg"
        );

    }
);



/* ==========================================
   초기값
========================================== */

textPreview.style.fontSize =
    fontSize.value + "px";


textPreview.style.color =
    textColor.value;


</script>
