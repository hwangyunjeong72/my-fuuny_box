<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<style>

/* =====================================
   기본
===================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        sans-serif;

    background-color: #f2f2f2;
}


/* =====================================
   상단
===================================== */

header {

    background-color: white;

    padding: 20px;

    text-align: center;

    border-bottom:
        1px solid #ddd;
}

header h1 {

    margin: 0;

    font-size: 28px;
}

header p {

    margin: 8px 0 0;

    color: #777;
}


/* =====================================
   전체
===================================== */

.container {

    width: 90%;

    max-width: 1100px;

    margin: 40px auto;

    display: flex;

    gap: 30px;
}


/* =====================================
   왼쪽 설정
===================================== */

.control-panel {

    width: 300px;

    background-color: white;

    padding: 25px;

    border-radius: 12px;

    box-shadow:
        0 3px 10px
        rgba(0,0,0,0.08);
}

.control-panel h2 {

    margin-top: 0;
}


/* =====================================
   설정
===================================== */

.setting {

    margin-top: 20px;
}

.setting label {

    display: block;

    margin-bottom: 7px;

    font-weight: bold;
}

.setting input[type="text"],
.setting input[type="number"] {

    width: 100%;

    padding: 9px;

    border:
        1px solid #ccc;

    border-radius: 6px;

    font-size: 15px;
}

.setting input[type="color"] {

    width: 100%;

    height: 40px;
}


/* =====================================
   업로드
===================================== */

.upload-button {

    display: block;

    width: 100%;

    padding: 15px;

    background-color: #333;

    color: white;

    text-align: center;

    border-radius: 8px;

    cursor: pointer;

    font-size: 16px;
}

.upload-button:hover {

    background-color: #555;
}

#imageInput {

    display: none;
}

.help-text {

    margin-top: 12px;

    font-size: 13px;

    color: #777;

    line-height: 1.5;
}


/* =====================================
   오류
===================================== */

#errorMessage {

    margin-top: 15px;

    color: #d00000;

    font-size: 14px;

    display: none;
}


/* =====================================
   슬라이더
===================================== */

.range-input {

    width: 100%;
}


/* =====================================
   아이콘 버튼
===================================== */

.icon-toggle {

    width: 100%;

    padding: 11px;

    border: none;

    border-radius: 7px;

    background-color: #333;

    color: white;

    cursor: pointer;

    font-size: 15px;
}

.icon-toggle:hover {

    background-color: #555;
}


/* =====================================
   아이콘 선택창
===================================== */

.icon-panel {

    display: none;

    margin-top: 10px;

    padding: 10px;

    background-color: #f5f5f5;

    border-radius: 8px;
}

.icon-list {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 6px;

    flex-wrap: wrap;
}

.icon-button {

    width: 50px;

    height: 50px;

    padding: 3px;

    border:
        1px solid #ddd;

    background-color: white;

    border-radius: 6px;

    cursor: pointer;
}

.icon-button:hover {

    border-color: #333;
}

.icon-button img {

    width: 100%;

    height: 100%;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================
   편집 영역
===================================== */

.preview-area {

    flex: 1;

    background-color: white;

    padding: 25px;

    border-radius: 12px;

    box-shadow:
        0 3px 10px
        rgba(0,0,0,0.08);

    text-align: center;
}

.preview-area h2 {

    margin-top: 0;
}


#editor {

    position: relative;

    display: inline-block;

    max-width: 100%;

    margin-top: 20px;

    line-height: 0;
}


/* =====================================
   이미지
===================================== */

#imagePreview {

    max-width: 100%;

    max-height: 600px;

    display: none;

    margin: 0 auto;

    border-radius: 8px;
}


/* =====================================
   이미지 없음
===================================== */

#emptyMessage {

    height: 400px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #999;

    border:
        2px dashed #ccc;

    border-radius: 10px;

    margin-top: 20px;

    line-height: 1.5;
}


/* =====================================
   일반 텍스트
===================================== */

#textPreview {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%)
        rotate(0deg);

    color: white;

    font-size: 40px;

    font-weight: bold;

    white-space: nowrap;

    cursor: move;

    user-select: none;

    z-index: 10;

    line-height: normal;
}


/* =====================================
   추가 이미지
===================================== */

.added-icon {

    position: absolute;

    width: 70px;

    height: 70px;

    object-fit: contain;

    cursor: move;

    user-select: none;

    touch-action: none;

    z-index: 20;

    line-height: normal;
}


/* =====================================
   글자 이모지
===================================== */

.text-emoji {

    position: absolute;

    width: 100px;

    height: 100px;

    object-fit: contain;

    cursor: move;

    user-select: none;

    touch-action: none;

    z-index: 30;

    transform:
        rotate(0deg);

    transform-origin: center center;
}


/* =====================================
   저장
===================================== */

.save-button {

    width: 100%;

    margin-top: 10px;

    padding: 11px;

    border: none;

    border-radius: 7px;

    background-color: #333;

    color: white;

    cursor: pointer;
}

.save-button:hover {

    background-color: #555;
}


/* =====================================
   모바일
===================================== */

@media (max-width: 700px) {

    .container {

        flex-direction: column;
    }

    .control-panel {

        width: 100%;
    }

    .preview-area {

        width: 100%;
    }

}

</style>

<script>


/* =====================================
   기본 요소
===================================== */

const imageInput =
    document.getElementById(
        "imageInput"
    );

const imagePreview =
    document.getElementById(
        "imagePreview"
    );

const emptyMessage =
    document.getElementById(
        "emptyMessage"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );

const textInput =
    document.getElementById(
        "textInput"
    );

const fontSize =
    document.getElementById(
        "fontSize"
    );

const textColor =
    document.getElementById(
        "textColor"
    );

const outlineColor =
    document.getElementById(
        "outlineColor"
    );

const outlineWidth =
    document.getElementById(
        "outlineWidth"
    );

const outlineWidthValue =
    document.getElementById(
        "outlineWidthValue"
    );

const rotation =
    document.getElementById(
        "rotation"
    );

const rotationValue =
    document.getElementById(
        "rotationValue"
    );

const textPreview =
    document.getElementById(
        "textPreview"
    );

const editor =
    document.getElementById(
        "editor"
    );



/* =====================================
   이미지 업로드
===================================== */

imageInput.addEventListener(
    "change",
    function() {

        errorMessage.style.display =
            "none";

        errorMessage.textContent =
            "";

        const file =
            imageInput.files[0];

        if (!file) {

            return;
        }


        if (
            file.type !== "image/png" &&
            file.type !== "image/jpeg"
        ) {

            errorMessage.textContent =
                "PNG 또는 JPG/JPEG 이미지만 사용할 수 있습니다.";

            errorMessage.style.display =
                "block";

            imageInput.value =
                "";

            return;
        }


        if (
            file.size >
            10 * 1024 * 1024
        ) {

            errorMessage.textContent =
                "파일 크기는 10MB 이하만 가능합니다.";

            errorMessage.style.display =
                "block";

            imageInput.value =
                "";

            return;
        }


        const imageURL =
            URL.createObjectURL(
                file
            );


        imagePreview.src =
            imageURL;


        imagePreview.onload =
            function() {

                imagePreview.style.display =
                    "block";

                emptyMessage.style.display =
                    "none";

                URL.revokeObjectURL(
                    imageURL
                );

            };

    }
);



/* =====================================
   텍스트
===================================== */

textInput.addEventListener(
    "input",
    function() {

        textPreview.textContent =
            textInput.value;

    }
);



/* =====================================
   글자 크기
===================================== */

fontSize.addEventListener(
    "input",
    function() {

        textPreview.style.fontSize =
            fontSize.value + "px";

    }
);



/* =====================================
   글자 색
===================================== */

textColor.addEventListener(
    "input",
    function() {

        textPreview.style.color =
            textColor.value;

    }
);



/* =====================================
   윤곽선 색
===================================== */

outlineColor.addEventListener(
    "input",
    function() {

        textPreview.style.webkitTextStrokeColor =
            outlineColor.value;

    }
);



/* =====================================
   윤곽선 굵기
===================================== */

outlineWidth.addEventListener(
    "input",
    function() {

        const value =
            outlineWidth.value;


        outlineWidthValue.textContent =
            value + "px";


        textPreview.style.webkitTextStrokeWidth =
            value + "px";

    }
);



/* =====================================
   글자 회전
===================================== */

rotation.addEventListener(
    "input",
    function() {

        const value =
            rotation.value;


        rotationValue.textContent =
            value + "°";


        updateTextTransform();

    }
);


function updateTextTransform() {

    textPreview.style.transform =
        "translate(-50%, -50%) rotate(" +
        rotation.value +
        "deg)";

}



/* =====================================
   별 패널
===================================== */

const starToggle =
    document.getElementById(
        "starToggle"
    );

const starPanel =
    document.getElementById(
        "starPanel"
    );


starToggle.addEventListener(
    "click",
    function() {

        starPanel.style.display =
            starPanel.style.display ===
            "block"
                ? "none"
                : "block";

    }
);



/* =====================================
   하트 패널
===================================== */

        "heartToggle"
    );

        "heartPanel"
    );


heartToggle.addEventListener(
    "click",

            heartPanel.style.display ===

/* =====================================
   글자 이모지 패널
===================================== */

const textEmojiToggle =

        "textEmojiToggle"

const textEmojiPanel =

    );

    "click",
    function() {

                ? "none"

/* =====================================
   검정 배경 제거
===================================== */

function removeBlackBackground(
    image
) {

    return new Promise(
        function(resolve, reject) {

            const canvas =
                document.createElement(
                    "canvas"
                );

            const ctx =
                canvas.getContext(
                    "2d",
                    {
                        willReadFrequently:
                            true
                    }
                );


            canvas.width =
                image.naturalWidth;

            canvas.height =
                image.naturalHeight;


            ctx.drawImage(
                image,
                0,
                0
            );


            let imageData;


            try {

                imageData =
                    ctx.getImageData(
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );

            } catch(error) {

                reject(error);

                return;
            }


            const data =
                imageData.data;


            const width =
                canvas.width;

            const height =
                canvas.height;


            function isBlack(
                x,
                y
            ) {

                const index =
                    (
                        y * width + x
                    ) * 4;


                const r =
                    data[index];

                const g =
                    data[index + 1];

                const b =
                    data[index + 2];

                const a =
                    data[index + 3];


                return (
                    a !== 0 &&
                    r <= 20 &&
                    g <= 20 &&
                    b <= 20
                );

            }


            const visited =
                new Uint8Array(
                    width * height
                );


            const queue = [];


            function addIfBlack(
                x,
                y
            ) {

                if (
                    x < 0 ||
                    y < 0 ||
                    x >= width ||
                    y >= height
                ) {

                    return;
                }


                const position =
                    y * width + x;


                if (
                    visited[position]
                ) {

                    return;
                }


                if (
                    !isBlack(x, y)
                ) {

                    return;
                }


                visited[position] =
                    1;


                queue.push(
                    [x, y]
                );

            }


            for (
                let x = 0;
                x < width;
                x++
            ) {

                addIfBlack(
                    x,
                    0
                );

                addIfBlack(
                    x,
                    height - 1
                );

            }


            for (
                let y = 0;
                y < height;
                y++
            ) {

                addIfBlack(
                    0,
                    y
                );

                addIfBlack(
                    width - 1,
                    y
                );

            }


            let index = 0;


            while (
                index <
                queue.length
            ) {

                const point =
                    queue[index++];


                const x =
                    point[0];

                const y =
                    point[1];


                const pixelIndex =
                    (
                        y * width + x
                    ) * 4;


                data[
                    pixelIndex + 3
                ] = 0;


                addIfBlack(
                    x,
                    y - 1
                );

                addIfBlack(
                    x,
                    y + 1
                );

                addIfBlack(
                    x - 1,
                    y
                );

                addIfBlack(
                    x + 1,
                    y
                );

            }


            ctx.putImageData(
                imageData,
                0,
                0
            );


            const result =
                new Image();


            result.onload =
                function() {

                    resolve(
                        result
                    );

                };


            result.onerror =
                function() {

                    reject(
                        new Error(
                            "이미지 처리 실패"
                        )
                    );

                };


            result.src =
                canvas.toDataURL(
                    "image/png"
                );

        }
    );

}

/* =====================================
   드래그
===================================== */

function makeDraggable(
    element
) {

    let dragging = false;

    let offsetX = 0;

    let offsetY = 0;


    element.addEventListener(
        "mousedown",
        function(event) {

            dragging = true;


            /* 클릭한 이모지를
               현재 선택 상태로 변경 */

            if (
                element.classList.contains(
                    "text-emoji"
                )
            ) {

                selectedEmoji =
                    element;


                const width =
                    element.offsetWidth;


                const rotationValueNow =
                    getRotation(
                        element
                    );


                emojiSize.value =
                    Math.round(
                        width
                    );


                emojiSizeValue.textContent =
                    Math.round(
                        width
                    ) + "px";


                emojiRotation.value =
                    rotationValueNow;


                emojiRotationValue.textContent =
                    rotationValueNow +
                    "°";

            }


            const rect =
                element.getBoundingClientRect();


            offsetX =
                event.clientX -
                rect.left;


            offsetY =
                event.clientY -
                rect.top;


            event.preventDefault();

        }
    );


    document.addEventListener(
        "mousemove",
        function(event) {

            if (!dragging) {

                return;
            }


            const editorRect =
                editor.getBoundingClientRect();


            let x =
                event.clientX -
                editorRect.left -
                offsetX;


            let y =
                event.clientY -
                editorRect.top -
                offsetY;


            x =
                Math.max(
                    0,
                    Math.min(
                        x,
                        editor.clientWidth -
                        element.offsetWidth
                    )
                );


            y =
                Math.max(
                    0,
                    Math.min(
                        y,
                        editor.clientHeight -
                        element.offsetHeight
                    )
                );


            element.style.left =
                x + "px";


            element.style.top =
                y + "px";

        }
    );


    document.addEventListener(
        "mouseup",
        function() {

            dragging = false;

        }
    );

}



/* =====================================
   회전값 가져오기
===================================== */

function getRotation(
    element
) {

    const transform =
        window.getComputedStyle(
            element
        ).transform;


    if (
        transform === "none"
    ) {

        return 0;
    }


    const values =
        transform
        .split("(")[1]
        .split(")")[0]
        .split(",");


    const a =
        parseFloat(
            values[0]
        );

    const b =
        parseFloat(
            values[1]
        );


    let angle =
        Math.round(
            Math.atan2(b, a) *
            (180 / Math.PI)
        );


    return angle;

}

function saveImage(
    type
) {

    if (
        !imagePreview.naturalWidth
    ) {

        alert(
            "먼저 이미지를 선택해주세요."
        );

        return;
    }


    const canvas =
        document.createElement(
            "canvas"
        );


    const ctx =
        canvas.getContext(
            "2d"
        );


    canvas.width =
        imagePreview.naturalWidth;


    canvas.height =
        imagePreview.naturalHeight;


    ctx.drawImage(
        imagePreview,
        0,
        0,
        canvas.width,
        canvas.height
    );


    const imageRect =
        imagePreview.getBoundingClientRect();


    const scaleX =
        canvas.width /
        imageRect.width;


    const scaleY =
        canvas.height /
        imageRect.height;



    /* =================================
       일반 텍스트 저장
    ================================= */

    if (
        textPreview.textContent.trim()
        !== ""
    ) {

        const rect =
            textPreview.getBoundingClientRect();


        const x =
            (
                rect.left +
                rect.width / 2 -
                imageRect.left
            ) * scaleX;


        const y =
            (
                rect.top +
                rect.height / 2 -
                imageRect.top
            ) * scaleY;


        const size =
            parseInt(
                fontSize.value
            ) * scaleX;


        ctx.save();


        ctx.translate(
            x,
            y
        );


        ctx.rotate(
            Number(
                rotation.value
            ) *
            Math.PI /
            180
        );


        ctx.font =
            "bold " +
            size +
            "px Arial";


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        ctx.lineWidth =
            Number(
                outlineWidth.value
            ) * scaleX;


        ctx.strokeStyle =
            outlineColor.value;


        ctx.strokeText(
            textPreview.textContent,
            0,
            0
        );


        ctx.fillStyle =
            textColor.value;


        ctx.fillText(
            textPreview.textContent,
            0,
            0
        );


        ctx.restore();

    }



    /* =================================
       별 / 하트 저장
    ================================= */

    const normalIcons =
        document.querySelectorAll(
            ".added-icon"
        );


    normalIcons.forEach(
        function(icon) {

            drawElementImage(
                ctx,
                icon,
                imageRect,
                scaleX,
                scaleY
            );

        }
    );



    /* =================================
       글자 이모지 저장
    ================================= */

    const textEmojis =
        document.querySelectorAll(
            ".text-emoji"
        );


    textEmojis.forEach(
        function(emoji) {

            drawRotatedImage(
                ctx,
                emoji,
                imageRect,
                scaleX,
                scaleY
            );

        }
    );



    /* =================================
       다운로드
    ================================= */

    const link =
        document.createElement(
            "a"
        );


    if (
        type === "png"
    ) {

        link.download =
            "짤카드.png";


        link.href =
            canvas.toDataURL(
                "image/png"
            );

    } else {

        link.download =
            "짤카드.jpg";


        link.href =
            canvas.toDataURL(
                "image/jpeg",
                0.95
            );

    }


    link.click();

}



/* =====================================
   일반 이미지 저장
===================================== */

function drawElementImage(
    ctx,
    element,
    imageRect,
    scaleX,
    scaleY
) {

    const rect =
        element.getBoundingClientRect();


    const x =
        (
            rect.left -
            imageRect.left
        ) * scaleX;


    const y =
        (
            rect.top -
            imageRect.top
        ) * scaleY;


    const width =
        rect.width *
        scaleX;


    const height =
        rect.height *
        scaleY;


    ctx.drawImage(
        element,
        x,
        y,
        width,
        height
    );

}



/* =====================================
   회전 이미지 저장
===================================== */

function drawRotatedImage(
    ctx,
    element,
    imageRect,
    scaleX,
    scaleY
) {

    const rect =
        element.getBoundingClientRect();


    const x =
        (
            rect.left +
            rect.width / 2 -
            imageRect.left
        ) * scaleX;


    const y =
        (
            rect.top +
            rect.height / 2 -
            imageRect.top
        ) * scaleY;


    const width =
        rect.width *
        scaleX;


    const height =
        rect.height *
        scaleY;


    const angle =
        getRotation(
            element
        ) *
        Math.PI /
        180;


    ctx.save();


    ctx.translate(
        x,
        y
    );


    ctx.rotate(
        angle
    );


    ctx.drawImage(
        element,
        -width / 2,
        -height / 2,
        width,
        height
    );


    ctx.restore();

}
