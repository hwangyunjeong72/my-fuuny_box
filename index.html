<script>


/* ==========================================
   기본 요소
========================================== */

const imageInput =
    document.getElementById("imageInput");

const imagePreview =
    document.getElementById("imagePreview");

const emptyMessage =
    document.getElementById("emptyMessage");

const errorMessage =
    document.getElementById("errorMessage");

const textInput =
    document.getElementById("textInput");

const fontSize =
    document.getElementById("fontSize");

const textColor =
    document.getElementById("textColor");

const rotation =
    document.getElementById("rotation");

const rotationValue =
    document.getElementById("rotationValue");

const textPreview =
    document.getElementById("textPreview");

const editor =
    document.getElementById("editor");



/* ==========================================
   현재 선택한 이모지
========================================== */

let selectedIcon = null;



/* ==========================================
   이미지 업로드
========================================== */

imageInput.addEventListener(
    "change",
    function () {

        errorMessage.style.display =
            "none";

        const file =
            imageInput.files[0];

        if (!file) {
            return;
        }


        if (
            file.type !== "image/png" &&
            file.type !== "image/jpeg"
        ) {

            errorMessage.textContent =
                "PNG 또는 JPG/JPEG 이미지만 사용할 수 있습니다.";

            errorMessage.style.display =
                "block";

            imageInput.value = "";

            return;
        }


        if (
            file.size >
            10 * 1024 * 1024
        ) {

            errorMessage.textContent =
                "파일 크기는 10MB 이하만 가능합니다.";

            errorMessage.style.display =
                "block";

            imageInput.value = "";

            return;
        }


        const url =
            URL.createObjectURL(file);


        imagePreview.src =
            url;


        imagePreview.onload =
            function () {

                imagePreview.style.display =
                    "block";

                emptyMessage.style.display =
                    "none";

                URL.revokeObjectURL(url);

            };

    }
);



/* ==========================================
   텍스트
========================================== */

textInput.addEventListener(
    "input",
    function () {

        textPreview.textContent =
            textInput.value;

    }
);



fontSize.addEventListener(
    "input",
    function () {

        textPreview.style.fontSize =
            fontSize.value + "px";

    }
);



textColor.addEventListener(
    "input",
    function () {

        textPreview.style.color =
            textColor.value;

    }
);



rotation.addEventListener(
    "input",
    function () {

        rotationValue.textContent =
            rotation.value + "°";


        textPreview.style.transform =
            "translate(-50%, -50%) rotate(" +
            rotation.value +
            "deg)";

    }
);



/* ==========================================
   선택창 열기
========================================== */

function togglePanel(panel) {

    if (
        panel.style.display === "block"
    ) {

        panel.style.display =
            "none";

    } else {

        panel.style.display =
            "block";

    }

}



document.getElementById(
    "starToggle"
).addEventListener(
    "click",
    function () {

        togglePanel(
            document.getElementById(
                "starPanel"
            )
        );

    }
);



document.getElementById(
    "heartToggle"
).addEventListener(
    "click",
    function () {

        togglePanel(
            document.getElementById(
                "heartPanel"
            )
        );

document.getElementById(

            document.getElementById(
                "wordPanel"
            )
        );

/* =================================================
   검정색 외곽 제거
================================================= */

function removeBlackBackground(image) {

    return new Promise(
        function(resolve, reject) {

            const canvas =
                document.createElement("canvas");

            const ctx =
                canvas.getContext(
                    "2d",
                    {
                        willReadFrequently: true
                    }
                );


            canvas.width =
                image.naturalWidth;

            canvas.height =
                image.naturalHeight;


            ctx.drawImage(
                image,
                0,
                0
            );


            const imageData =
                ctx.getImageData(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


            const data =
                imageData.data;

            const width =
                canvas.width;

            const height =
                canvas.height;


            function isBlack(x, y) {

                const index =
                    (
                        y * width + x
                    ) * 4;


                const r =
                    data[index];

                const g =
                    data[index + 1];

                const b =
                    data[index + 2];

                const a =
                    data[index + 3];


                if (a === 0) {
                    return false;
                }


                return (
                    r <= 20 &&
                    g <= 20 &&
                    b <= 20
                );

            }


            const visited =
                new Uint8Array(
                    width * height
                );


            const queue = [];


            function addIfBlack(x, y) {

                if (
                    x < 0 ||
                    y < 0 ||
                    x >= width ||
                    y >= height
                ) {
                    return;
                }


                const position =
                    y * width + x;


                if (
                    visited[position]
                ) {
                    return;
                }


                if (
                    !isBlack(x, y)
                ) {
                    return;
                }


                visited[position] = 1;

                queue.push(
                    [x, y]
                );

            }


            for (
                let x = 0;
                x < width;
                x++
            ) {

                addIfBlack(x, 0);

                addIfBlack(
                    x,
                    height - 1
                );

            }


            for (
                let y = 0;
                y < height;
                y++
            ) {

                addIfBlack(0, y);

                addIfBlack(
                    width - 1,
                    y
                );

            }


            let index = 0;


            while (
                index < queue.length
            ) {

                const point =
                    queue[index++];

                const x =
                    point[0];

                const y =
                    point[1];


                const pixelIndex =
                    (
                        y * width + x
                    ) * 4;


                data[
                    pixelIndex + 3
                ] = 0;


                addIfBlack(
                    x,
                    y - 1
                );

                addIfBlack(
                    x,
                    y + 1
                );

                addIfBlack(
                    x - 1,
                    y
                );

                addIfBlack(
                    x + 1,
                    y
                );

            }


            ctx.putImageData(
                imageData,
                0,
                0
            );


            const result =
                new Image();


            result.onload =
                function() {

                    resolve(result);

                };


            result.onerror =
                function() {

                    reject(
                        new Error(
                            "투명 이미지 생성 실패"
                        )
                    );

                };


            result.src =
                canvas.toDataURL(
                    "image/png"
                );

        }
    );

}



/* =================================================
   이모지 추가
================================================= */

async function addIcon(fileName) {

    const original =
        new Image();


    original.onload =
        async function() {

            try {

                const cleanIcon =
                    await removeBlackBackground(
                        original
                    );


                const icon =
                    document.createElement(
                        "img"
                    );


                icon.src =
                    cleanIcon.src;


                icon.className =
                    "added-icon";


                icon.style.width =
                    "70px";

                icon.style.height =
                    "70px";


                icon.dataset.rotation =
                    "0";


                /*
                 * 처음에는 중앙에 배치
                 */

                icon.style.left =
                    (
                        editor.clientWidth / 2 -
                        35
                    ) + "px";


                icon.style.top =
                    (
                        editor.clientHeight / 2 -
                        35
                    ) + "px";


                editor.appendChild(
                    icon
                );


                /*
                 * 드래그 기능
                 */

                makeIconDraggable(
                    icon
                );


                /*
                 * 새로 추가한 이모지를
                 * 바로 선택
                 */

                selectIcon(
                    icon
                );

            } catch(error) {

                console.error(error);

                alert(
                    "이모지를 처리하는 중 오류가 발생했습니다."
                );

            }

        };


    original.onerror =
        function() {

            alert(
                fileName +
                " 파일을 찾을 수 없습니다."
            );

        };


    original.src =
        fileName +
        "?v=" +
        Date.now();

}



/* =================================================
   이모지 선택
================================================= */

function selectIcon(icon) {

    /*
     * 기존 선택 제거
     */

    if (selectedIcon) {

        selectedIcon.classList.remove(
            "selected"
        );

    }


    /*
     * 새 선택
     */

    selectedIcon =
        icon;


    selectedIcon.classList.add(
        "selected"
    );


    /*
     * 현재 크기 표시
     */

    const size =
        parseInt(
            icon.style.width
        ) || 70;


    document.getElementById(
        "iconSize"
    ).value =
        size;


    document.getElementById(
        "iconSizeValue"
    ).textContent =
        size + "px";


    /*
     * 현재 회전값 표시
     */

    const angle =
        Number(
            icon.dataset.rotation
        ) || 0;


    document.getElementById(
        "iconRotation"
    ).value =
        angle;


    document.getElementById(

function makeIconDraggable(icon) {

    let dragging =
        false;

    let offsetX =
        0;

    let offsetY =
        0;


    icon.addEventListener(
        "mousedown",
        function(event) {

            /*
             * 클릭한 이모지를 선택
             */

            selectIcon(
                icon
            );


            dragging =
                true;


            const rect =
                icon.getBoundingClientRect();


            offsetX =
                event.clientX -
                rect.left;


            offsetY =
                event.clientY -
                rect.top;


            event.preventDefault();

        }
    );


    document.addEventListener(
        "mousemove",
        function(event) {

            if (!dragging) {
                return;
            }


            const editorRect =
                editor.getBoundingClientRect();


            let x =
                event.clientX -
                editorRect.left -
                offsetX;


            let y =
                event.clientY -
                editorRect.top -
                offsetY;


            /*
             * 편집 영역 밖으로
             * 나가지 않도록 제한
             */

            x =
                Math.max(
                    0,
                    Math.min(
                        x,
                        editor.clientWidth -
                        icon.offsetWidth
                    )
                );


            y =
                Math.max(
                    0,
                    Math.min(
                        y,
                        editor.clientHeight -
                        icon.offsetHeight
                    )
                );


            icon.style.left =
                x + "px";


            icon.style.top =
                y + "px";

        }
    );


    document.addEventListener(
        "mouseup",
        function() {

            dragging =
                false;

        }
    );

}

/* =================================================

================================================= */

function saveImage(type) {

    if (
        !imagePreview.src ||
        !imagePreview.naturalWidth
    ) {

        alert(
            "먼저 이미지를 선택해주세요."
        );

        return;

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    const ctx =
        canvas.getContext(
            "2d"
        );


    canvas.width =
        imagePreview.naturalWidth;


    canvas.height =
        imagePreview.naturalHeight;


    /*
     * 원본 이미지
     */

    ctx.drawImage(
        imagePreview,
        0,
        0,
        canvas.width,
        canvas.height
    );


    const imageRect =
        imagePreview.getBoundingClientRect();


    const scaleX =
        canvas.width /
        imageRect.width;


    const scaleY =
        canvas.height /
        imageRect.height;



    /* =================================
       텍스트 저장
    ================================= */

    if (
        textPreview.textContent.trim()
        !== ""
    ) {

        const textRect =
            textPreview.getBoundingClientRect();


        const x =
            (
                textRect.left +
                textRect.width / 2 -
                imageRect.left
            ) * scaleX;


        const y =
            (
                textRect.top +
                textRect.height / 2 -
                imageRect.top
            ) * scaleY;


        const size =
            parseInt(
                fontSize.value
            ) * scaleX;


        ctx.save();


        ctx.translate(
            x,
            y
        );


        ctx.rotate(
            Number(
                rotation.value
            ) *
            Math.PI /
            180
        );


        ctx.font =
            "bold " +
            size +
            "px Arial";


        ctx.fillStyle =
            textColor.value;


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        ctx.fillText(
            textPreview.textContent,
            0,
            0
        );


        ctx.restore();

    }



    /* =================================
       이모지 저장
    ================================= */

    const icons =
        document.querySelectorAll(
            ".added-icon"
        );


    icons.forEach(
        function(icon) {

            const iconRect =
                icon.getBoundingClientRect();


            /*
             * 이모지 중심점
             */

            const centerX =
                (
                    iconRect.left +
                    iconRect.width / 2 -
                    imageRect.left
                ) * scaleX;


            const centerY =
                (
                    iconRect.top +
                    iconRect.height / 2 -
                    imageRect.top
                ) * scaleY;


            const width =
                icon.offsetWidth *
                scaleX;


            const height =
                icon.offsetHeight *
                scaleY;


            const angle =
                Number(
                    icon.dataset.rotation
                ) || 0;


            /*
             * 회전 적용
             */

            ctx.save();


            ctx.translate(
                centerX,
                centerY
            );


            ctx.rotate(
                angle *
                Math.PI /
                180
            );


            ctx.drawImage(
                icon,
                -width / 2,
                -height / 2,
                width,
                height
            );


            ctx.restore();

        }
    );



    /* =================================
       파일 형식
    ================================= */

    let mimeType;
    let extension;


    if (
        type === "png"
    ) {

        mimeType =
            "image/png";

        extension =
            "png";

    } else {

        mimeType =
            "image/jpeg";

        extension =
            "jpg";

    }



    /* =================================
       다운로드
    ================================= */

    canvas.toBlob(
        function(blob) {

            if (!blob) {

                alert(
                    "이미지 저장에 실패했습니다."
                );

                return;

            }


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                "짤카드." +
                extension;


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );


            URL.revokeObjectURL(
                url
            );

        },
        mimeType,
        0.95
    );

}
