```html
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>짤·카드 스튜디오</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }


        /* =========================
           상단
        ========================= */

        header {
            background-color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            color: #777;
        }


        /* =========================
           전체 영역
        ========================= */

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;

            display: flex;
            gap: 30px;
        }


        /* =========================
           왼쪽 설정 패널
        ========================= */

        .control-panel {
            width: 300px;

            background-color: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .control-panel h2 {
            margin-top: 0;
        }


        /* =========================
           이미지 업로드 버튼
        ========================= */

        .upload-button {
            display: block;

            width: 100%;

            padding: 15px;

            background-color: #333;

            color: white;

            text-align: center;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;
        }

        .upload-button:hover {
            background-color: #555;
        }

        #imageInput {
            display: none;
        }


        /* =========================
           설정 항목
        ========================= */

        .setting {
            margin-top: 25px;
        }

        .setting label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }


        /* =========================
           문구 입력
        ========================= */

        #textInput {
            width: 100%;

            padding: 10px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 16px;
        }


        /* =========================
           슬라이더
        ========================= */

        #fontSize,
        #rotation {
            width: 100%;
        }


        /* =========================
           글자 색상
        ========================= */

        #textColor {
            width: 60px;

            height: 40px;

            border: none;

            cursor: pointer;
        }


        /* =========================
           슬라이더 값 표시
        ========================= */

        .value-display {
            display: inline-block;

            margin-top: 5px;

            font-size: 14px;

            color: #555;
        }


        /* =========================
           오류 메시지
        ========================= */

        #errorMessage {
            margin-top: 15px;

            color: #d00000;

            font-size: 14px;

            display: none;
        }


        /* =========================
           오른쪽 미리보기
        ========================= */

        .preview-area {
            flex: 1;

            background-color: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        .preview-area h2 {
            margin-top: 0;
        }


        /* =========================
           이미지 + 텍스트 영역
        ========================= */

        #canvasArea {
            position: relative;

            display: inline-block;

            max-width: 100%;

            margin-top: 20px;
        }


        /* =========================
           업로드 이미지
        ========================= */

        #imagePreview {
            max-width: 100%;

            max-height: 600px;

            display: none;

            border-radius: 8px;

            vertical-align: top;
        }


        /* =========================
           텍스트 박스
        ========================= */

        #textBox {
            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                rotate(0deg);

            color: white;

            font-size: 40px;

            font-weight: bold;

            text-shadow:
                2px 2px 4px black,
                -2px -2px 4px black;

            cursor: move;

            user-select: none;

            display: none;

            white-space: nowrap;
        }


        /* =========================
           드래그 중
        ========================= */

        #textBox:active {
            cursor: grabbing;
        }


        /* =========================
           이미지가 없을 때
        ========================= */

        #emptyMessage {
            height: 400px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #999;

            border: 2px dashed #ccc;

            border-radius: 10px;

            margin-top: 20px;
        }


        /* =========================
           모바일
        ========================= */

        @media (max-width: 700px) {

            .container {
                flex-direction: column;
            }

            .control-panel {
                width: 100%;
            }

            .preview-area {
                width: 100%;
            }

            #textBox {
                font-size: 28px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         제목
    ========================= -->

    <header>

        <h1>
            짤·카드 스튜디오
        </h1>

        <p>
            이미지를 업로드하고 나만의 밈·카드를 만들어보세요.
        </p>

    </header>



    <!-- =========================
         전체 영역
    ========================= -->

    <div class="container">


        <!-- =========================
             왼쪽 설정
        ========================= -->

        <div class="control-panel">

            <h2>
                편집 설정
            </h2>


            <!-- 이미지 업로드 -->

            <label
                for="imageInput"
                class="upload-button">

                이미지 선택

            </label>


            <input
                type="file"
                id="imageInput"
                accept="image/png, image/jpeg"
            >


            <!-- =========================
                 문구
            ========================= -->

            <div class="setting">

                <label for="textInput">
                    문구
                </label>

                <input
                    type="text"
                    id="textInput"
                    placeholder="문구를 입력하세요"
                    value="오늘도 화이팅!"
                >

            </div>



            <!-- =========================
                 글자 크기
            ========================= -->

            <div class="setting">

                <label for="fontSize">
                    글자 크기
                </label>

                <input
                    type="range"
                    id="fontSize"
                    min="10"
                    max="100"
                    value="40"
                >

                <span
                    id="fontSizeValue"
                    class="value-display">

                    40px

                </span>

            </div>



            <!-- =========================
                 글자 색상
            ========================= -->

            <div class="setting">

                <label for="textColor">
                    글자 색상
                </label>

                <input
                    type="color"
                    id="textColor"
                    value="#ffffff"
                >

            </div>



            <!-- =========================
                 텍스트 회전
            ========================= -->

            <div class="setting">

                <label for="rotation">
                    텍스트 회전
                </label>

                <input
                    type="range"
                    id="rotation"
                    min="-180"
                    max="180"
                    value="0"
                    step="1"
                >

                <span
                    id="rotationValue"
                    class="value-display">

                    0°

                </span>

            </div>



            <!-- =========================
                 안내
            ========================= -->

            <div class="setting">

                <p
                    style="
                    font-size: 13px;
                    color: #777;
                    line-height: 1.5;
                    ">

                    문구를 입력하면 이미지 위에 표시됩니다.<br>
                    문구를 마우스로 드래그해서 이동할 수 있습니다.<br>
                    회전 슬라이더를 움직여 문구를 회전할 수 있습니다.

                </p>

            </div>



            <!-- 오류 -->

            <div id="errorMessage"></div>

        </div>



        <!-- =========================
             오른쪽 미리보기
        ========================= -->

        <div class="preview-area">

            <h2>
                미리보기
            </h2>


            <!-- 이미지가 없을 때 -->

            <div id="emptyMessage">

                이미지를 선택하면<br>
                여기에 미리보기가 나타납니다.

            </div>


            <!-- 이미지 + 텍스트 -->

            <div id="canvasArea">

                <img
                    id="imagePreview"
                    alt="업로드된 이미지"
                >


                <div id="textBox">

                    오늘도 화이팅!

                </div>

            </div>

        </div>

    </div>



    <!-- =========================
         JavaScript
    ========================= -->

    <script>


        /* =========================
           HTML 요소 가져오기
        ========================= */

        const imageInput =
            document.getElementById("imageInput");

        const imagePreview =
            document.getElementById("imagePreview");

        const emptyMessage =
            document.getElementById("emptyMessage");

        const errorMessage =
            document.getElementById("errorMessage");

        const textInput =
            document.getElementById("textInput");

        const textBox =
            document.getElementById("textBox");

        const fontSize =
            document.getElementById("fontSize");

        const fontSizeValue =
            document.getElementById("fontSizeValue");

        const textColor =
            document.getElementById("textColor");

        const rotation =
            document.getElementById("rotation");

        const rotationValue =
            document.getElementById("rotationValue");



        /* =========================
           이미지 업로드
        ========================= */

        imageInput.addEventListener(
            "change",
            function () {


                /* 오류 메시지 초기화 */

                errorMessage.style.display =
                    "none";

                errorMessage.textContent =
                    "";


                /* 선택된 파일 */

                const file =
                    imageInput.files[0];


                if (!file) {
                    return;
                }



                /* =========================
                   파일 형식 확인
                ========================= */

                if (
                    file.type !== "image/png" &&
                    file.type !== "image/jpeg"
                ) {

                    errorMessage.textContent =
                        "잘못된 파일입니다. PNG 또는 JPG/JPEG 이미지를 선택해주세요.";

                    errorMessage.style.display =
                        "block";


                    imagePreview.style.display =
                        "none";

                    textBox.style.display =
                        "none";

                    emptyMessage.style.display =
                        "flex";


                    imageInput.value =
                        "";

                    return;
                }



                /* =========================
                   파일 크기 확인
                ========================= */

                const maxSize =
                    10 * 1024 * 1024;


                if (file.size > maxSize) {

                    errorMessage.textContent =
                        "파일 크기가 너무 큽니다. 10MB 이하의 이미지를 선택해주세요.";

                    errorMessage.style.display =
                        "block";


                    imagePreview.style.display =
                        "none";

                    textBox.style.display =
                        "none";

                    emptyMessage.style.display =
                        "flex";


                    imageInput.value =
                        "";

                    return;
                }



                /* =========================
                   이미지 표시
                ========================= */

                const imageURL =
                    URL.createObjectURL(file);


                imagePreview.src =
                    imageURL;


                imagePreview.style.display =
                    "block";


                emptyMessage.style.display =
                    "none";


                /* 텍스트 표시 */

                textBox.style.display =
                    "block";

            }
        );



        /* =========================
           문구 변경
        ========================= */

        textInput.addEventListener(
            "input",
            function () {

                textBox.textContent =
                    textInput.value;

            }
        );



        /* =========================
           글자 크기 변경
        ========================= */

        fontSize.addEventListener(
            "input",
            function () {


                const size =
                    fontSize.value;


                textBox.style.fontSize =
                    size + "px";


                fontSizeValue.textContent =
                    size + "px";

            }
        );



        /* =========================
           글자 색상 변경
        ========================= */

        textColor.addEventListener(
            "input",
            function () {

                textBox.style.color =
                    textColor.value;

            }
        );



        /* =========================
           ★ 텍스트 회전
        ========================= */

        rotation.addEventListener(
            "input",
            function () {


                /* 현재 회전 각도 */

                const angle =
                    rotation.value;


                /* 텍스트 회전 */

                textBox.style.transform =
                    "translate(-50%, -50%) rotate(" +
                    angle +
                    "deg)";


                /* 화면에 각도 표시 */

                rotationValue.textContent =
                    angle + "°";

            }
        );



        /* =========================
           텍스트 드래그
        ========================= */

        let isDragging =
            false;

        let startX =
            0;

        let startY =
            0;

        let startLeft =
            0;

        let startTop =
            0;



        /* 마우스를 눌렀을 때 */

        textBox.addEventListener(
            "mousedown",
            function (event) {


                isDragging =
                    true;


                startX =
                    event.clientX;

                startY =
                    event.clientY;


                startLeft =
                    textBox.offsetLeft;

                startTop =
                    textBox.offsetTop;


                event.preventDefault();

            }
        );



        /* 마우스로 이동 */

        document.addEventListener(
            "mousemove",
            function (event) {


                if (!isDragging) {
                    return;
                }


                const moveX =
                    event.clientX - startX;

                const moveY =
                    event.clientY - startY;


                textBox.style.left =
                    (startLeft + moveX) + "px";


                textBox.style.top =
                    (startTop + moveY) + "px";


                /*
                    위치 이동 시에도
                    기존 회전값 유지
                */

                textBox.style.transform =
                    "translate(-50%, -50%) rotate(" +
                    rotation.value +
                    "deg)";

            }
        );



        /* 마우스를 놓았을 때 */

        document.addEventListener(
            "mouseup",
            function () {

                isDragging =
                    false;

            }
        );



        /* =========================
           모바일 터치 드래그
        ========================= */

        textBox.addEventListener(
            "touchstart",
            function (event) {


                const touch =
                    event.touches[0];


                isDragging =
                    true;


                startX =
                    touch.clientX;

                startY =
                    touch.clientY;


                startLeft =
                    textBox.offsetLeft;

                startTop =
                    textBox.offsetTop;

            }
        );



        document.addEventListener(
            "touchmove",
            function (event) {


                if (!isDragging) {
                    return;
                }


                const touch =
                    event.touches[0];


                const moveX =
                    touch.clientX - startX;

                const moveY =
                    touch.clientY - startY;


                textBox.style.left =
                    (startLeft + moveX) + "px";


                textBox.style.top =
                    (startTop + moveY) + "px";


                /*
                    터치 이동 중에도
                    회전값 유지
                */

                textBox.style.transform =
                    "translate(-50%, -50%) rotate(" +
                    rotation.value +
                    "deg)";


                event.preventDefault();

            },
            {
                passive: false
            }
        );



        /* 터치 종료 */

        document.addEventListener(
            "touchend",
            function () {

                isDragging =
                    false;

            }
        );


    </script>

</body>

</html>
