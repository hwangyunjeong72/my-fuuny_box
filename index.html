<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>짤·카드 스튜디오</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f2f2}
header{background:#fff;padding:20px;text-align:center;border-bottom:1px solid #ddd}
header h1{margin:0} header p{color:#777}
.container{width:94%;max-width:1500px;margin:30px auto;display:flex;gap:24px;align-items:flex-start}
.control-panel,.preview-area{background:#fff;padding:22px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.control-panel{width:300px;flex:none}.setting{margin-top:18px}
.setting label{display:block;margin-bottom:7px;font-weight:bold}
.setting input[type=text],.setting input[type=number]{width:100%;padding:9px;border:1px solid #ccc;border-radius:6px}
.setting input[type=color]{width:100%;height:40px}
.setting input[type=range]{width:100%}
.upload-button,.icon-toggle,.save-button,.template-save{display:block;width:100%;padding:11px;border:0;border-radius:7px;background:#333;color:#fff;cursor:pointer;font-size:15px;text-align:center}
.upload-button{padding:15px}.upload-button:hover,.icon-toggle:hover,.save-button:hover,.template-save:hover{background:#555}
#imageInput{display:none}.help-text{margin-top:9px;font-size:13px;color:#777}#errorMessage{display:none;margin-top:10px;color:red}
.icon-panel{display:none;margin-top:10px;padding:10px;background:#f5f5f5;border-radius:8px}
.icon-list{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.icon-button{width:48px;height:48px;padding:3px;border:1px solid #ddd;background:#fff;border-radius:6px;cursor:pointer}
.icon-button:hover{border-color:#333}.icon-button img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.added-icon,.text-emoji{position:absolute;width:70px;height:70px;object-fit:contain;cursor:move;user-select:none;touch-action:none;z-index:20;transform-origin:center}
.added-icon.selected{outline:2px dashed #333;outline-offset:3px}
#iconControlBox{display:none;margin-top:15px;padding:15px;background:#f7f7f7;border:1px solid #ddd;border-radius:8px}
.icon-value{font-weight:bold}.delete-icon-button{width:100%;margin-top:12px;padding:10px;border:0;border-radius:6px;background:#d33;color:#fff;cursor:pointer}
.preview-area{flex:1;position:sticky;top:20px;align-self:flex-start;max-height:calc(100vh - 40px);overflow:auto}
.preview-layout{display:flex;gap:22px;align-items:flex-start}
.preview-main{flex:1;min-width:0;text-align:center}
.template-panel{width:240px;flex:none;border:1px solid #ddd;border-radius:10px;padding:15px;background:#fafafa;text-align:left}
.template-panel h3{margin:0 0 12px}.template-name{width:100%;padding:9px;border:1px solid #ccc;border-radius:6px;margin-bottom:8px}
.template-help{font-size:12px;color:#777;line-height:1.5;margin-bottom:10px}
.template-list{margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto}
.template-item{background:#fff;border:1px solid #ddd;border-radius:8px;padding:9px}
.template-item-name{font-weight:bold;word-break:break-all;margin-bottom:7px}
.template-actions{display:flex;gap:5px}.template-actions button{flex:1;border:0;border-radius:5px;padding:7px;cursor:pointer}
.load-template{background:#333;color:#fff}.delete-template{background:#eee;color:#b00}
#editor{position:relative;display:inline-block;max-width:100%;margin-top:20px;line-height:0}
#imagePreview{max-width:100%;max-height:600px;display:none;margin:0 auto;border-radius:8px}
#emptyMessage{height:400px;display:flex;align-items:center;justify-content:center;color:#999;border:2px dashed #ccc;border-radius:10px;margin-top:20px;line-height:1.5}
#textPreview{position:absolute;left:50%;top:50%;color:#fff;font-size:40px;font-weight:bold;white-space:pre-wrap;cursor:move;user-select:none;z-index:10;line-height:normal;transform:translate(-50%,-50%) rotate(0deg);max-width:95%}
@media(max-width:1000px){.container{flex-wrap:wrap}.control-panel{width:300px}.preview-area{width:calc(100% - 324px)}.preview-layout{flex-direction:column}.template-panel{width:100%}}
@media(max-width:700px){.container{flex-direction:column}.control-panel,.preview-area{width:100%;position:static;max-height:none;overflow:visible}.preview-layout{flex-direction:column}.template-panel{width:100%}}
</style>
</head>
<body>
<header>
<h1>짤·카드 스튜디오</h1>
<p>이미지를 업로드하고 나만의 밈·카드를 만들어보세요.</p>
</header>

<div class="container">
<div class="control-panel">
<h2>설정</h2>
<label for="imageInput" class="upload-button">이미지 선택</label>
<input type="file" id="imageInput" accept="image/png, image/jpeg">
<div class="help-text">PNG 또는 JPG/JPEG 파일만 업로드할 수 있습니다.</div>
<div id="errorMessage"></div>

<div class="setting"><label>텍스트</label><input type="text" id="textInput" placeholder="텍스트를 입력하세요"></div>
<div class="setting"><label>글자 크기</label><input type="number" id="fontSize" value="40" min="10" max="200"></div>
<div class="setting"><label>글자 색</label><input type="color" id="textColor" value="#ffffff"></div>
<div class="setting"><label>글자 윤곽선 색</label><input type="color" id="outlineColor" value="#000000"></div>
<div class="setting"><label>윤곽선 굵기 <span id="outlineWidthValue">3px</span></label><input type="range" id="outlineWidth" min="0" max="20" value="3"></div>
<div class="setting"><label>글자 회전 <span id="rotationValue">0°</span></label><input type="range" id="rotation" min="-180" max="180" value="0"></div>

<div class="setting">
<button type="button" class="icon-toggle" id="starToggle">⭐ 별 이모지 추가</button>
<div class="icon-panel" id="starPanel"><div class="icon-list">
<button class="icon-button" data-icon="노란별.png"><img src="노란별.png" alt="노란별"></button>
<button class="icon-button" data-icon="파란별.png"><img src="파란별.png" alt="파란별"></button>
<button class="icon-button" data-icon="보라별.png"><img src="보라별.png" alt="보라별"></button>
<button class="icon-button" data-icon="초록별.png"><img src="초록별.png" alt="초록별"></button>
<button class="icon-button" data-icon="핑크별.png"><img src="핑크별.png" alt="핑크별"></button>
</div></div>
</div>

<div class="setting">
<button type="button" class="icon-toggle" id="heartToggle">❤️ 하트 이모지 추가</button>
<div class="icon-panel" id="heartPanel"><div class="icon-list">
<button class="icon-button" data-heart="노란하트.png"><img src="노란하트.png" alt="노란하트"></button>
<button class="icon-button" data-heart="보라하트.png"><img src="보라하트.png" alt="보라하트"></button>
<button class="icon-button" data-heart="파란하트.png"><img src="파란하트.png" alt="파란하트"></button>
<button class="icon-button" data-heart="핑크하트.png"><img src="핑크하트.png" alt="핑크하트"></button>
<button class="icon-button" data-heart="초록하트.png"><img src="초록하트.png" alt="초록하트"></button>
</div></div>
</div>

<div class="setting">
<button type="button" class="icon-toggle" id="textEmojiToggle">📝 글자 이모지 추가</button>
<div class="icon-panel" id="textEmojiPanel"><div class="icon-list">
<button class="icon-button" data-text-emoji="굿.png"><img src="굿.png" alt="굿"></button>
<button class="icon-button" data-text-emoji="신.png"><img src="신.png" alt="신"></button>
<button class="icon-button" data-text-emoji="천재.png"><img src="천재.png" alt="천재"></button>
<button class="icon-button" data-text-emoji="최고.png"><img src="최고.png" alt="최고"></button>
<button class="icon-button" data-text-emoji="최애.png"><img src="최애.png" alt="최애"></button>
</div></div>
</div>

<div id="iconControlBox">
<label>선택한 이모지 크기 <span class="icon-value" id="iconSizeValue">70px</span></label>
<input type="range" id="iconSize" min="20" max="300" value="70">
<div style="margin-top:15px">
<label>선택한 이모지 회전 <span class="icon-value" id="iconRotationValue">0°</span></label>
<input type="range" id="iconRotation" min="-180" max="180" value="0">
</div>
<button type="button" class="delete-icon-button" id="deleteIconButton">🗑 선택한 이모지 삭제</button>
</div>

<div class="setting">
<button type="button" class="save-button" id="savePNG">PNG로 저장</button>
<button type="button" class="save-button" id="saveJPG" style="margin-top:8px">JPG로 저장</button>
</div>
</div>

<div class="preview-area">
<h2>미리보기</h2>
<div class="preview-layout">
<div class="preview-main">
<div id="emptyMessage">이미지를 선택하면<br>여기에 미리보기가 나타납니다.</div>
<div id="editor">
<img id="imagePreview" alt="업로드된 이미지">
<div id="textPreview"></div>
</div>
</div>

<div class="template-panel">
<h3>📁 템플릿</h3>
<div class="template-help">현재 이미지와 텍스트·이모지의 편집 상태를 저장합니다. 저장한 템플릿은 이 브라우저에 보관되어 새로고침해도 유지됩니다.</div>
<input type="text" id="templateName" class="template-name" placeholder="템플릿 이름">
<button type="button" class="template-save" id="saveTemplate">현재 템플릿 저장</button>
<div id="templateList" class="template-list"></div>
</div>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const imageInput=$("imageInput"),imagePreview=$("imagePreview"),emptyMessage=$("emptyMessage"),errorMessage=$("errorMessage");
const textInput=$("textInput"),fontSize=$("fontSize"),textColor=$("textColor"),outlineColor=$("outlineColor"),outlineWidth=$("outlineWidth"),outlineWidthValue=$("outlineWidthValue");
const rotation=$("rotation"),rotationValue=$("rotationValue"),textPreview=$("textPreview"),editor=$("editor");
let selectedIcon=null;
let currentImageData=null;

function togglePanel(panel){panel.style.display=panel.style.display==="block"?"none":"block"}
$("starToggle").onclick=()=>togglePanel($("starPanel"));
$("heartToggle").onclick=()=>togglePanel($("heartPanel"));
$("textEmojiToggle").onclick=()=>togglePanel($("textEmojiPanel"));

function showError(msg){errorMessage.textContent=msg;errorMessage.style.display="block"}
function clearError(){errorMessage.textContent="";errorMessage.style.display="none"}

imageInput.addEventListener("change",()=>{
 clearError(); const file=imageInput.files[0]; if(!file)return;
 if(!["image/png","image/jpeg"].includes(file.type)){showError("PNG 또는 JPG/JPEG 이미지만 사용할 수 있습니다.");imageInput.value="";return}
 if(file.size>10*1024*1024){showError("파일 크기는 10MB 이하만 가능합니다.");imageInput.value="";return}
 const reader=new FileReader();
 reader.onload=e=>{currentImageData=e.target.result;setImage(currentImageData)};
 reader.readAsDataURL(file);
});

function setImage(src){
 imagePreview.onload=()=>{imagePreview.style.display="block";emptyMessage.style.display="none"};
 imagePreview.src=src;
}

textInput.addEventListener("input",()=>textPreview.textContent=textInput.value);
fontSize.addEventListener("input",()=>textPreview.style.fontSize=fontSize.value+"px");
textColor.addEventListener("input",()=>textPreview.style.color=textColor.value);
outlineColor.addEventListener("input",()=>textPreview.style.webkitTextStrokeColor=outlineColor.value);
outlineWidth.addEventListener("input",()=>{outlineWidthValue.textContent=outlineWidth.value+"px";textPreview.style.webkitTextStrokeWidth=outlineWidth.value+"px"});
rotation.addEventListener("input",()=>{rotationValue.textContent=rotation.value+"°";updateTextTransform()});

function updateTextTransform(){
 textPreview.style.transform="translate(-50%,-50%) rotate("+rotation.value+"deg)";
}

function removeBlackBackground(image){
 return new Promise((resolve,reject)=>{
  const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d",{willReadFrequently:true});
  canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;ctx.drawImage(image,0,0);
  let d;try{d=ctx.getImageData(0,0,canvas.width,canvas.height)}catch(e){reject(e);return}
  const data=d.data,w=canvas.width,h=canvas.height,visited=new Uint8Array(w*h),queue=[];
  const black=(x,y)=>{const i=(y*w+x)*4;return data[i+3]>0&&data[i]<=35&&data[i+1]<=35&&data[i+2]<=35};
  const add=(x,y)=>{if(x<0||y<0||x>=w||y>=h)return;const p=y*w+x;if(!visited[p]&&black(x,y)){visited[p]=1;queue.push([x,y])}};
  for(let x=0;x<w;x++){add(x,0);add(x,h-1)} for(let y=0;y<h;y++){add(0,y);add(w-1,y)}
  for(let i=0;i<queue.length;i++){const [x,y]=queue[i],p=(y*w+x)*4;data[p+3]=0;add(x,y-1);add(x,y+1);add(x-1,y);add(x+1,y)}
  ctx.putImageData(d,0,0);const result=new Image();
  result.onload=()=>resolve(result);result.onerror=()=>reject(new Error("투명 이미지 생성 실패"));result.src=canvas.toDataURL("image/png");
 });
}

async function addEmoji(fileName, savedData=null){
 const original=new Image();
 original.onload=async()=>{
  try{
   const clean= savedData ? savedData : (await removeBlackBackground(original)).src;
   const emoji=document.createElement("img");
   emoji.src=clean;emoji.className="added-icon";emoji.style.width="70px";emoji.style.height="70px";
   emoji.style.left=(editor.clientWidth-70)/2+"px";emoji.style.top=(editor.clientHeight-70)/2+"px";emoji.style.transform="rotate(0deg)";
   editor.appendChild(emoji);makeDraggable(emoji);selectIcon(emoji);
  }catch(e){console.error(e);alert("이모지를 추가하는 중 오류가 발생했습니다.")}
 };
 original.onerror=()=>{if(savedData){const emoji=document.createElement("img");emoji.src=savedData;emoji.className="added-icon";emoji.style.width="70px";emoji.style.height="70px";editor.appendChild(emoji);makeDraggable(emoji);selectIcon(emoji)}else alert(fileName+" 파일을 찾을 수 없습니다.")};
 original.src=savedData||fileName+"?v="+Date.now();
}

document.querySelectorAll("[data-icon],[data-heart],[data-text-emoji]").forEach(button=>{
 button.addEventListener("click",()=>addEmoji(button.dataset.icon||button.dataset.heart||button.dataset.textEmoji));
});

function selectIcon(el){
 document.querySelectorAll(".added-icon.selected").forEach(x=>x.classList.remove("selected"));
 selectedIcon=el;el.classList.add("selected");$("iconControlBox").style.display="block";
 const size=Math.round(el.offsetWidth),angle=getRotation(el);
 $("iconSize").value=size;$("iconSizeValue").textContent=size+"px";$("iconRotation").value=angle;$("iconRotationValue").textContent=angle+"°";
}

$("iconSize").addEventListener("input",()=>{if(!selectedIcon)return;const v=Number($("iconSize").value);selectedIcon.style.width=v+"px";selectedIcon.style.height=v+"px";$("iconSizeValue").textContent=v+"px"});
$("iconRotation").addEventListener("input",()=>{if(!selectedIcon)return;const v=Number($("iconRotation").value);selectedIcon.style.transform="rotate("+v+"deg)";$("iconRotationValue").textContent=v+"°"});
$("deleteIconButton").onclick=()=>{if(!selectedIcon)return;selectedIcon.remove();selectedIcon=null;$("iconControlBox").style.display="none"};

function makeDraggable(el){
 let dragging=false,ox=0,oy=0;
 el.addEventListener("mousedown",e=>{
  selectIcon(el);dragging=true;const r=el.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;e.preventDefault();
 });
 document.addEventListener("mousemove",e=>{
  if(!dragging)return;const er=editor.getBoundingClientRect();
  let x=e.clientX-er.left-ox,y=e.clientY-er.top-oy;
  x=Math.max(0,Math.min(x,editor.clientWidth-el.offsetWidth));y=Math.max(0,Math.min(y,editor.clientHeight-el.offsetHeight));
  el.style.left=x+"px";el.style.top=y+"px";
 });
 document.addEventListener("mouseup",()=>dragging=false);
 el.addEventListener("touchstart",e=>{
  selectIcon(el);const t=e.touches[0],r=el.getBoundingClientRect();ox=t.clientX-r.left;oy=t.clientY-r.top;dragging=true;e.preventDefault();
 },{passive:false});
 el.addEventListener("touchmove",e=>{
  if(!dragging)return;const t=e.touches[0],er=editor.getBoundingClientRect();
  let x=t.clientX-er.left-ox,y=t.clientY-er.top-oy;x=Math.max(0,Math.min(x,editor.clientWidth-el.offsetWidth));y=Math.max(0,Math.min(y,editor.clientHeight-el.offsetHeight));
  el.style.left=x+"px";el.style.top=y+"px";e.preventDefault();
 },{passive:false});
 el.addEventListener("touchend",()=>dragging=false);
}

function getRotation(el){
 const t=getComputedStyle(el).transform;if(!t||t==="none")return 0;
 const m=t.match(/matrix\\(([^)]+)\\)/);if(!m)return 0;const v=m[1].split(",").map(Number);return Math.round(Math.atan2(v[1],v[0])*180/Math.PI);
}

let textDragging=false,textOffsetX=0,textOffsetY=0;
textPreview.addEventListener("mousedown",e=>{
 textDragging=true;const r=textPreview.getBoundingClientRect();textOffsetX=e.clientX-r.left;textOffsetY=e.clientY-r.top;e.preventDefault();
});
document.addEventListener("mousemove",e=>{
 if(!textDragging)return;const er=editor.getBoundingClientRect();textPreview.style.left=e.clientX-er.left-textOffsetX+"px";textPreview.style.top=e.clientY-er.top-textOffsetY+"px";
});
document.addEventListener("mouseup",()=>textDragging=false);

textPreview.addEventListener("touchstart",e=>{
 const t=e.touches[0],r=textPreview.getBoundingClientRect();textDragging=true;textOffsetX=t.clientX-r.left;textOffsetY=t.clientY-r.top;e.preventDefault();
},{passive:false});
textPreview.addEventListener("touchmove",e=>{
 if(!textDragging)return;const t=e.touches[0],er=editor.getBoundingClientRect();textPreview.style.left=t.clientX-er.left-textOffsetX+"px";textPreview.style.top=t.clientY-er.top-textOffsetY+"px";e.preventDefault();
},{passive:false});
textPreview.addEventListener("touchend",()=>textDragging=false);

function drawMultilineText(ctx,text,x,y,maxWidth){
 const lines=text.split("\n");const lineHeight=parseInt(fontSize.value)*1.2;
 ctx.textAlign="center";ctx.textBaseline="middle";
 const startY=y-(lines.length-1)*lineHeight/2;
 lines.forEach((line,i)=>{ctx.strokeText(line,x,startY+i*lineHeight);ctx.fillText(line,x,startY+i*lineHeight)});
}

function saveImage(type){
 if(!imagePreview.naturalWidth){alert("먼저 이미지를 선택해주세요.");return}
 const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d");
 canvas.width=imagePreview.naturalWidth;canvas.height=imagePreview.naturalHeight;
 ctx.drawImage(imagePreview,0,0,canvas.width,canvas.height);
 const ir=imagePreview.getBoundingClientRect(),sx=canvas.width/ir.width,sy=canvas.height/ir.height;
 if(textPreview.textContent.trim()!==""){
  const r=textPreview.getBoundingClientRect(),x=(r.left+r.width/2-ir.left)*sx,y=(r.top+r.height/2-ir.top)*sy,size=parseInt(fontSize.value)*sx;
  ctx.save();ctx.translate(x,y);ctx.rotate(Number(rotation.value)*Math.PI/180);ctx.font="bold "+size+"px Arial";ctx.lineWidth=Number(outlineWidth.value)*sx;ctx.strokeStyle=outlineColor.value;ctx.fillStyle=textColor.value;drawMultilineText(ctx,textPreview.textContent,0,0);ctx.restore();
 }
 document.querySelectorAll(".added-icon").forEach(icon=>drawRotatedImage(ctx,icon,ir,sx,sy));
 const link=document.createElement("a");
 if(type==="png"){link.download="짤카드.png";link.href=canvas.toDataURL("image/png")}
 else{link.download="짤카드.jpg";link.href=canvas.toDataURL("image/jpeg",.95)}
 link.click();
}

function drawRotatedImage(ctx,el,ir,sx,sy){
 const r=el.getBoundingClientRect(),x=(r.left+r.width/2-ir.left)*sx,y=(r.top+r.height/2-ir.top)*sy,w=r.width*sx,h=r.height*sy,a=getRotation(el)*Math.PI/180;
 ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.drawImage(el,-w/2,-h/2,w,h);ctx.restore();
}
$("savePNG").onclick=()=>saveImage("png");$("saveJPG").onclick=()=>saveImage("jpg");

/* =========================
   템플릿 기능
========================= */
const TEMPLATE_KEY="funny_box_templates_v1";
const templateName=$("templateName"),templateList=$("templateList");

function getTemplates(){
 try{return JSON.parse(localStorage.getItem(TEMPLATE_KEY)||"[]")}catch(e){return []}
}
function setTemplates(list){localStorage.setItem(TEMPLATE_KEY,JSON.stringify(list))}
function makeTemplateState(){
 const editorRect=editor.getBoundingClientRect();
 const textRect=textPreview.getBoundingClientRect();
 const state={
  image:currentImageData||imagePreview.src||null,
  text:{
   value:textInput.value,fontSize:fontSize.value,color:textColor.value,outlineColor:outlineColor.value,
   outlineWidth:outlineWidth.value,rotation:rotation.value,
   left:parseFloat(textPreview.style.left)||editor.clientWidth/2,
   top:parseFloat(textPreview.style.top)||editor.clientHeight/2
  },
  icons:[]
 };
 document.querySelectorAll(".added-icon").forEach(icon=>{
  state.icons.push({
   src:icon.src,width:parseFloat(icon.style.width)||icon.offsetWidth,height:parseFloat(icon.style.height)||icon.offsetHeight,
   left:parseFloat(icon.style.left)||0,top:parseFloat(icon.style.top)||0,rotation:getRotation(icon)
  });
 });
 return state;
}
function applyTemplateState(state){
 if(!state)return;
 selectedIcon=null;$("iconControlBox").style.display="none";document.querySelectorAll(".added-icon").forEach(x=>x.remove());
 currentImageData=state.image||null;
 if(state.image)setImage(state.image);
 const t=state.text||{};
 textInput.value=t.value||"";fontSize.value=t.fontSize||40;textColor.value=t.color||"#ffffff";outlineColor.value=t.outlineColor||"#000000";outlineWidth.value=t.outlineWidth??3;rotation.value=t.rotation??0;
 textPreview.textContent=textInput.value;textPreview.style.fontSize=fontSize.value+"px";textPreview.style.color=textColor.value;textPreview.style.webkitTextStrokeColor=outlineColor.value;textPreview.style.webkitTextStrokeWidth=outlineWidth.value+"px";
 outlineWidthValue.textContent=outlineWidth.value+"px";rotationValue.textContent=rotation.value+"°";
 textPreview.style.left=(t.left??editor.clientWidth/2)+"px";textPreview.style.top=(t.top??editor.clientHeight/2)+"px";updateTextTransform();
 (state.icons||[]).forEach(iconData=>{
  const img=document.createElement("img");img.src=iconData.src;img.className="added-icon";img.style.width=(iconData.width||70)+"px";img.style.height=(iconData.height||70)+"px";img.style.left=(iconData.left||0)+"px";img.style.top=(iconData.top||0)+"px";img.style.transform="rotate("+(iconData.rotation||0)+"deg)";
  editor.appendChild(img);makeDraggable(img);
 });
}
function renderTemplates(){
 templateList.innerHTML="";const list=getTemplates();
 if(!list.length){templateList.innerHTML='<div style="font-size:13px;color:#999">저장된 템플릿이 없습니다.</div>';return}
 list.forEach(t=>{
  const item=document.createElement("div");item.className="template-item";
  const name=document.createElement("div");name.className="template-item-name";name.textContent=t.name;
  const actions=document.createElement("div");actions.className="template-actions";
  const load=document.createElement("button");load.className="load-template";load.textContent="불러오기";load.onclick=()=>applyTemplateState(t.state);
  const del=document.createElement("button");del.className="delete-template";del.textContent="삭제";del.onclick=()=>{
   if(confirm('"'+t.name+'" 템플릿을 삭제할까요?')){setTemplates(getTemplates().filter(x=>x.id!==t.id));renderTemplates()}
  };
  actions.append(load,del);item.append(name,actions);templateList.appendChild(item);
 });
}
$("saveTemplate").onclick=()=>{
 const name=templateName.value.trim();
 if(!name){alert("템플릿 이름을 입력해주세요.");templateName.focus();return}
 try{
  const list=getTemplates();const same=list.findIndex(x=>x.name===name);
  const data={id:same>=0?list[same].id:Date.now().toString(),name,state:makeTemplateState()};
  if(same>=0){if(!confirm("같은 이름의 템플릿을 덮어쓸까요?"))return;list[same]=data}else list.push(data);
  setTemplates(list);templateName.value="";renderTemplates();alert("템플릿이 저장되었습니다.");
 }catch(e){alert("템플릿 저장에 실패했습니다. 이미지가 너무 크면 다른 이미지를 사용해보세요.");console.error(e)}
};
renderTemplates();
</script>
